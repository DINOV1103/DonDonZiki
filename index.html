<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0623">
<title>DON DON ZIKI — Arena</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0623;--ink:#1b1330;--text:#fff;--muted:#bdb2e8;--dim:#8a7fb8;
  --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.13);--stroke:rgba(255,255,255,.14);--stroke2:rgba(255,255,255,.26);
  --gold:#ffd23f;--orange:#ff9a1f;--pink:#ff2e7e;--cyan:#22e4ff;--violet:#8b5cf6;--green:#34f5a4;--red:#ff4d6d;
  --fd:'Bungee','Impact','Arial Black',system-ui,sans-serif;
  --fb:'Nunito','Trebuchet MS',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.9,.25,1);--spring:cubic-bezier(.2,1.5,.4,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e0623;--text:#fff}}
:root[data-theme="dark"]{--bg:#0e0623;--text:#fff}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg);isolation:isolate}

/* ===== ambient background ===== */
.amb{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:radial-gradient(120% 70% at 50% -10%,#3b1487 0,transparent 60%),radial-gradient(90% 60% at 100% 110%,#0d3b7a 0,transparent 60%),radial-gradient(90% 60% at 0 110%,#6b0f4a 0,transparent 60%),var(--bg)}
.orb{position:absolute;border-radius:50%;filter:blur(46px);opacity:.5;animation:orb 16s ease-in-out infinite alternate}
.orb.o1{width:260px;height:260px;left:-90px;top:10%;background:#7c3aed}
.orb.o2{width:220px;height:220px;right:-80px;top:42%;background:#ff2e7e;animation-delay:-6s}
.orb.o3{width:250px;height:250px;left:18%;bottom:-100px;background:#0ea5e9;animation-delay:-11s}
.gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:30px 30px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 28%,#000 25%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 28%,#000 25%,transparent 72%)}

/* ===== screens ===== */
.screen{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;visibility:hidden;opacity:0;transform:translateY(14px) scale(.985);
  transition:opacity .32s var(--ease),transform .32s var(--ease),visibility 0s linear .32s}
.screen.active{visibility:visible;opacity:1;transform:none;transition:opacity .32s var(--ease),transform .32s var(--ease)}

/* ===== common ui ===== */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 14px 6px;position:relative;z-index:3}
.topbar .ttl{flex:1;min-width:0;font-family:var(--fd);font-size:17px;letter-spacing:.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .12s var(--ease),background .2s}
.ib:active{transform:scale(.9);background:var(--glass2)}
.ib svg,.btn svg,.mode .go svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.spacer{width:42px;flex:0 0 42px}
.chip{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-radius:14px;background:var(--glass);border:1px solid var(--stroke);font-weight:900;font-size:14px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border-radius:18px;
  font-family:var(--fd);font-size:16px;letter-spacing:.5px;overflow:hidden;transition:transform .12s var(--ease),filter .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;filter:grayscale(.7);pointer-events:none}
.btn.primary{color:#2b1100;background:linear-gradient(135deg,#ffe98a 0,#ffb42b 45%,#ff6a2b 100%);
  box-shadow:0 14px 30px -12px rgba(255,130,30,.85),inset 0 1px 0 rgba(255,255,255,.75),inset 0 -3px 0 rgba(0,0,0,.14)}
.btn.primary::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-18deg);animation:shine 3.4s ease-in-out infinite}
.btn.glass{color:#fff;height:52px;font-size:13.5px;background:var(--glass);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.btn.danger{color:#fff;height:52px;font-size:13.5px;background:linear-gradient(135deg,#ff6b86,#e0204a);box-shadow:0 12px 26px -12px rgba(255,40,90,.8)}
.row{display:flex;gap:10px}
.row>.btn{flex:1}
.bottombar{position:relative;z-index:3;display:flex;flex-direction:column;gap:10px;padding:12px 14px 16px;background:linear-gradient(180deg,transparent,rgba(8,3,20,.8) 38%)}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar{display:none}
.av{position:relative;display:block;overflow:hidden;background:#2a1760;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 75%,#fff) 0,color-mix(in srgb,var(--c) 38%,#12072b) 72%)}
.av svg{width:100%;height:100%;display:block}

/* ===== splash ===== */
#splash{align-items:center;justify-content:center;gap:20px;cursor:pointer}
.logo{text-align:center;line-height:.95}
.logo .l1{font-family:var(--fd);font-size:clamp(26px,8.5vw,40px);letter-spacing:3px;text-shadow:0 4px 0 #6d28d9,0 0 24px rgba(160,90,255,.8)}
.logo .l2{display:inline-block;font-family:var(--fd);font-size:clamp(62px,20vw,98px);
  background:linear-gradient(180deg,#fff7b0 0,#ffd23f 35%,#ff8a00 70%,#ff4d00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 #9f1239) drop-shadow(0 0 22px rgba(255,160,0,.5))}
.logo .l3{display:inline-block;margin-top:8px;font-family:var(--fd);font-size:11px;letter-spacing:6px;color:var(--cyan);padding:5px 14px;border:1px solid rgba(34,228,255,.5);border-radius:999px;text-shadow:0 0 10px rgba(34,228,255,.9);background:rgba(34,228,255,.07)}
#splash .logo{animation:logoIn 1s var(--spring) both}
.loader{width:190px;height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.loader i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));animation:load 1.6s var(--ease) .2s forwards}
.sp-note{font-size:12px;font-weight:800;color:var(--dim);letter-spacing:1px}

/* ===== home ===== */
#home .logo{margin-top:0}
#home .logo .l1{font-size:clamp(20px,6.5vw,30px)}
#home .logo .l2{font-size:clamp(48px,15.5vw,74px);animation:pulse 2.4s ease-in-out infinite}
.lineup{position:relative;flex:1;min-height:118px;margin-top:10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;cursor:pointer}
.lineup .glow{position:absolute;bottom:0;left:50%;width:86%;height:44px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(139,92,246,.6),transparent 70%)}
.lineup .ring{position:absolute;bottom:8px;left:50%;width:72%;height:22px;transform:translateX(-50%);border-radius:50%;border:2px solid rgba(34,228,255,.65);box-shadow:0 0 18px rgba(34,228,255,.6),inset 0 0 14px rgba(34,228,255,.4)}
.lu{position:relative;height:100%;max-height:250px;display:flex;align-items:flex-end;justify-content:center}
.lu .c{position:relative;height:100%;aspect-ratio:200/260}
.lu .c svg{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 96%;animation:bob 2.4s ease-in-out infinite}
.lu .c.s{height:76%;margin:0 -24px;filter:brightness(.72) saturate(.9)}
.lu .c.m{z-index:1}
.lu .c.s:first-child svg{animation-delay:-.8s}.lu .c.s:last-child svg{animation-delay:-1.6s}
.lu .c.s:last-child{transform:scaleX(-1)}
.lu.swap .c{animation:swapIn .5s var(--spring) both}.lu.swap .c.m{animation-delay:.06s}.lu.swap .c.s:last-child{animation-name:swapInR;animation-delay:.12s}
.hbub{position:absolute;top:0;left:50%;z-index:4;max-width:92%;padding:8px 13px 9px;border-radius:16px;background:#fff;color:var(--ink);
  font-weight:900;font-size:13px;line-height:1.3;box-shadow:0 10px 24px rgba(0,0,0,.35);opacity:0;transform:translateX(-50%) scale(.7);transition:.3s var(--spring);pointer-events:none;text-align:center}
.hbub.on{opacity:1;transform:translateX(-50%) scale(1)}
.hbub b{display:block;font-family:var(--fd);font-weight:400;font-size:10px}
.modes{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px;padding:4px 14px 0}
.mode{position:relative;display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;text-align:left;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:transform .14s var(--ease)}
.mode:active{transform:scale(.975)}
.mode::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 150% at 0% 0%,var(--a) 0,transparent 55%);opacity:.32}
.mode .ic{position:relative;width:58px;height:58px;flex:0 0 58px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:var(--g);
  box-shadow:0 10px 22px -8px var(--a),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.15)}
.mode .tx{position:relative;flex:1;min-width:0}
.mode .t1{display:block;font-family:var(--fd);font-size:18px;letter-spacing:.5px}
.mode .t2{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-top:3px}
.mode .go{position:relative;width:36px;height:36px;flex:0 0 36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.mode .badge{position:absolute;top:9px;right:58px;font-size:9.5px;font-weight:900;letter-spacing:.5px;padding:3px 8px;border-radius:999px;background:var(--green);color:#002b1a}
.foot{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px;padding:10px 14px 14px}
.ver{text-align:center;font-size:10.5px;font-weight:800;color:var(--dim);letter-spacing:2px}

/* ===== select ===== */
.stepper{display:flex;justify-content:center;gap:6px;padding:0 0 4px;position:relative;z-index:3}
.stepper i{width:28px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);transition:background .3s}
.stepper i.on{background:var(--gold);box-shadow:0 0 10px rgba(255,210,63,.6)}
.preview{position:relative;z-index:2;margin:6px 14px 0;display:flex;align-items:stretch;gap:10px;padding:12px 14px 12px 8px;border-radius:24px;overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.03));border:1px solid var(--stroke)}
.preview::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 100% at 18% 70%,var(--c,#8b5cf6) 0,transparent 62%);opacity:.5;transition:opacity .3s}
.pv-art{position:relative;width:40%;flex:0 0 40%;display:flex;align-items:flex-end;justify-content:center}
.pv-art svg{width:100%;height:auto;max-height:200px;display:block;overflow:visible;transform-origin:50% 96%;animation:bob 2.2s ease-in-out infinite}
.pv-art.pop svg{animation:popIn .45s var(--spring),bob 2.2s .45s ease-in-out infinite}
.pv-info{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
.pv-name{font-family:var(--fd);font-size:22px;line-height:1.05;color:var(--c,#fff);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.pv-tag{font-size:13px;font-weight:900}
.pv-q{font-size:12.5px;font-weight:800;color:var(--muted);font-style:italic;line-height:1.3}
.tr{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center;margin-top:5px}
.tr span{font-size:9.5px;font-weight:900;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.tr .bar{height:7px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.tr .bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--c,#8b5cf6),#fff);transition:width .6s var(--ease)}
.heroes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 14px 10px;align-content:start}
.ht{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 5px 9px;border-radius:18px;background:var(--glass);border:1.5px solid var(--stroke);
  transition:transform .14s var(--ease),border-color .2s,box-shadow .2s,opacity .2s,background .2s}
.ht:active{transform:scale(.93)}
.ht .av{width:100%;max-width:76px;aspect-ratio:1;border-radius:15px}
.ht .n{font-family:var(--fd);font-size:10px;line-height:1.1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ht.sel{border-color:var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,transparent),rgba(255,255,255,.04));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 32%,transparent),0 12px 26px -10px var(--c)}
.ht.lock{opacity:.35;pointer-events:none}
.ht .tag{position:absolute;top:-8px;right:-4px;z-index:2;font-family:var(--fd);font-size:9px;padding:3px 7px;border-radius:999px;background:var(--cyan);color:#001a1f;box-shadow:0 4px 10px rgba(0,0,0,.35)}

/* ===== bracket ===== */
.tsteps{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:5px;padding:4px 10px 6px}
.tstep{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;font-weight:900;color:var(--dim);letter-spacing:.4px;white-space:nowrap}
.tstep i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--fd);font-size:11px;background:rgba(255,255,255,.08);border:1px solid var(--stroke);color:var(--muted)}
.tstep.on{color:#fff}
.tstep.on i{background:linear-gradient(135deg,#ffe98a,#ff8a1f);color:#2b1100;border-color:transparent;box-shadow:0 0 16px rgba(255,170,40,.7);animation:pulse 1.6s ease-in-out infinite}
.tstep.done i{background:var(--green);color:#002b1a;border-color:transparent}
.tline{width:18px;height:2px;margin-bottom:16px;border-radius:2px;background:var(--stroke)}
.tline.done{background:var(--green)}
.blist{padding:6px 14px 12px}
.bsec{margin-bottom:12px}
.bsec h3{display:flex;align-items:center;gap:8px;margin:6px 2px 9px;font-family:var(--fd);font-weight:400;font-size:12.5px;letter-spacing:1px;color:var(--muted)}
.bsec h3::after{content:"";flex:1;height:1px;background:var(--stroke)}
.bsec.cur h3{color:var(--gold)}
.mc{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px;margin-bottom:9px;border-radius:18px;
  background:var(--glass);border:1px solid var(--stroke);transition:border-color .3s,box-shadow .3s}
.mc.me{border-color:rgba(255,210,63,.75);background:linear-gradient(135deg,rgba(255,210,63,.15),rgba(255,255,255,.04));box-shadow:0 0 0 3px rgba(255,210,63,.16),0 14px 28px -14px rgba(255,190,40,.8);margin-top:12px}
.mc.flash{animation:flashCard .7s var(--spring)}
.side{display:flex;align-items:center;gap:8px;min-width:0}
.side.r{flex-direction:row-reverse;text-align:right}
.side .av{width:42px;height:42px;flex:0 0 42px;border-radius:13px}
.side .nm{min-width:0;font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .you{display:block;font-family:var(--fd);font-weight:400;font-size:9px;color:var(--gold);letter-spacing:.6px}
.side.lost{opacity:.42;filter:grayscale(.85)}
.side.won .nm{color:var(--green)}
.side.tbd .av{display:grid;place-items:center;background:rgba(255,255,255,.06);font-family:var(--fd);color:var(--dim)}
.side.tbd .nm{color:var(--dim)}
.sc{min-width:54px;padding:5px 8px;border-radius:11px;text-align:center;font-family:var(--fd);font-size:15px;letter-spacing:1px;background:rgba(0,0,0,.3)}
.sc.vs{font-size:11px;color:var(--muted)}
.melabel{position:absolute;top:-10px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--fd);font-size:9px;letter-spacing:.8px;padding:4px 10px;border-radius:999px;
  background:linear-gradient(135deg,#ffe98a,#ff8a1f);color:#2b1100;box-shadow:0 6px 14px rgba(255,150,30,.45)}
.champslot{display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px;border-radius:22px;border:1px dashed var(--stroke2);background:rgba(255,255,255,.03)}
.champslot .av{width:74px;height:74px;border-radius:20px}
.champslot .av.empty{display:grid;place-items:center;font-size:34px;background:rgba(255,255,255,.06)}
.champslot .cn{font-family:var(--fd);font-size:15px}
.champslot.won{border-style:solid;border-color:rgba(255,210,63,.7);background:linear-gradient(135deg,rgba(255,210,63,.16),rgba(255,255,255,.03));box-shadow:0 0 30px -8px rgba(255,200,40,.7)}

/* ===== VS ===== */
#vs{background:#05020c;overflow:hidden}
.vsh{position:absolute;top:0;bottom:0;width:64%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.vsh.l{left:0;clip-path:polygon(0 0,100% 0,58% 100%,0 100%);background:linear-gradient(150deg,var(--c),#12052b 85%);animation:slideL .45s var(--ease) both;justify-content:flex-start;padding-top:12%}
.vsh.r{right:0;clip-path:polygon(42% 0,100% 0,100% 100%,0 100%);background:linear-gradient(330deg,var(--c),#12052b 85%);animation:slideR .45s var(--ease) both;justify-content:flex-end;padding-bottom:10%}
.vsh .cs{width:74%;max-width:260px}
.vsh .cs svg{width:100%;height:auto;display:block}
.vsh.r .cs{transform:scaleX(-1)}
.vsh .vn{font-family:var(--fd);font-size:clamp(20px,7vw,30px);text-shadow:0 3px 0 rgba(0,0,0,.5)}
.vsh .vt{font-weight:900;font-size:12px;letter-spacing:2px;opacity:.85}
.vsh.l .vn,.vsh.l .vt{margin-right:22%}.vsh.r .vn,.vsh.r .vt{margin-left:22%}
.vstext{position:absolute;top:50%;left:50%;font-family:var(--fd);font-size:clamp(84px,28vw,130px);color:#fff;
  text-shadow:0 0 30px #fff,0 7px 0 var(--pink),0 0 60px var(--pink);animation:vsSlam .55s .38s both}
.vsstage{position:absolute;top:3%;left:50%;transform:translateX(-50%);z-index:2;font-family:var(--fd);font-size:13px;letter-spacing:2px;padding:6px 16px;border-radius:999px;
  background:linear-gradient(135deg,#ffe98a,#ff8a1f);color:#2b1100;box-shadow:0 8px 20px rgba(255,150,30,.5);animation:dropIn .5s .6s var(--spring) both;white-space:nowrap}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash .6s .45s both;pointer-events:none}

/* ===== game ===== */
#game{background:var(--bg)}
.hud{position:relative;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 10px 8px;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent)}
.pp{display:flex;align-items:center;gap:8px;min-width:0;padding:6px 8px;border-radius:16px;background:rgba(10,4,26,.5);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pp.r{flex-direction:row-reverse;text-align:right}
.pp .av{width:38px;height:38px;flex:0 0 38px;border-radius:12px}
.pp .meta{min-width:0;display:flex;flex-direction:column;gap:5px}
.pp.r .meta{align-items:flex-end}
.pp .n{font-family:var(--fd);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stars{display:flex;gap:4px}
.stars i{width:17px;height:17px;background:rgba(255,255,255,.2);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.stars i.on{background:linear-gradient(#fff7a8,#ffae00);animation:starpop .55s cubic-bezier(.2,1.8,.4,1)}
.mid{display:flex;flex-direction:column;align-items:center;gap:5px}
.rnd{font-family:var(--fd);font-size:11.5px;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid var(--stroke);white-space:nowrap}
.stg{font-size:9px;font-weight:900;color:var(--gold);letter-spacing:.8px;white-space:nowrap;min-height:10px}
.mid .icons{display:flex;gap:6px}
.mid .ib{width:32px;height:32px;flex-basis:32px;border-radius:10px}
.mid .ib svg{width:15px;height:15px}

.stage{position:relative;flex:1;min-height:0;overflow:hidden}
.sky{position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 100%,rgba(255,46,126,.35) 0,transparent 70%),radial-gradient(60% 40% at 50% 0%,rgba(120,60,255,.45) 0,transparent 70%),linear-gradient(180deg,#1c0b44 0,#2f1068 50%,#150733 100%)}
.neon{position:absolute;top:2%;left:0;right:0;text-align:center;font-family:var(--fd);font-size:12px;letter-spacing:3px;color:#ff8ac0;text-shadow:0 0 6px var(--pink),0 0 18px var(--pink);opacity:.5}
.beam{position:absolute;top:-8%;width:42%;height:95%;pointer-events:none;mix-blend-mode:screen;transform-origin:50% 0;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 90%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);animation:sweep 5s ease-in-out infinite alternate}
.beam.b1{left:-6%}.beam.b2{right:-6%;animation-delay:-2.5s;animation-direction:alternate-reverse}
.beam.b3{left:29%;background:linear-gradient(180deg,rgba(255,46,126,.35),transparent 85%);animation-duration:3.6s}
.crowd{position:absolute;left:0;right:0;bottom:18%;height:22%;pointer-events:none}
.crowd svg{width:100%;height:100%;display:block}
.cp{animation:bob 1.5s ease-in-out infinite;transform-box:fill-box}
.crowd.hype .cp{animation:hop .32s ease-in-out infinite}
.flashp{animation:tw 3s infinite}
.floor{position:absolute;left:-40%;right:-40%;bottom:0;height:40%;transform-origin:50% 100%;transform:perspective(240px) rotateX(58deg);
  background:repeating-linear-gradient(90deg,rgba(34,228,255,.3) 0 2px,transparent 2px 64px),repeating-linear-gradient(0deg,rgba(34,228,255,.3) 0 2px,transparent 2px 44px),linear-gradient(180deg,#3a137a,#0d0524)}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--cyan);box-shadow:0 0 20px 4px var(--cyan)}
.ring{position:absolute;left:50%;bottom:4%;width:94%;height:13%;transform:translateX(-50%);border-radius:50%;border:3px solid var(--pink);box-shadow:0 0 22px var(--pink),inset 0 0 22px var(--pink);opacity:.85}
.fighter{position:absolute;bottom:4%;width:47%;display:flex;flex-direction:column;align-items:center;z-index:4}
.fighter.left{left:1.5%}.fighter.right{right:1.5%}
.fighter.left.enter{animation:inL .7s cubic-bezier(.2,1.35,.4,1) both}
.fighter.right.enter{animation:inR .7s .12s cubic-bezier(.2,1.35,.4,1) both}
.char{position:relative;width:100%;max-width:235px;aspect-ratio:200/260}
.char svg{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 96%}
.fighter.right .char{transform:scaleX(-1)}
.fighter.right .char text,.vsh.r .cs text,.lu .c.s:last-child text{transform:scaleX(-1);transform-box:fill-box;transform-origin:center}
.char.idle svg{animation:bob 2.2s ease-in-out infinite}
.char.laugh svg{animation:laughS .24s ease-in-out infinite}
.char.cry svg{animation:sob .55s ease-in-out infinite}
.char.tense svg{animation:jit .12s linear infinite}
.nameplate{font-family:var(--fd);font-size:11.5px;padding:4px 11px;border-radius:10px;background:rgba(0,0,0,.55);border:1px solid var(--stroke);margin-top:-4px;white-space:nowrap}
.stream{animation:flow .45s linear infinite}
.drop{transform-box:fill-box;animation:drop .9s ease-in infinite}
.sweat{transform-box:fill-box;animation:sweat 1s ease-in infinite}
.bubble{position:absolute;top:6%;max-width:74%;z-index:8;background:#fff;color:var(--ink);border-radius:18px;padding:9px 14px 11px;font-weight:800;font-size:15px;line-height:1.32;
  box-shadow:0 7px 0 rgba(0,0,0,.28);opacity:0;transform:scale(.6) translateY(12px);transition:opacity .2s,transform .25s var(--spring);pointer-events:none}
.bubble .who{display:block;font-family:var(--fd);font-size:11px;font-weight:400;margin-bottom:2px}
.bubble.l{left:3%;transform-origin:18% 100%}.bubble.r{right:3%;transform-origin:82% 100%}
.bubble.show{opacity:1;transform:none}
.bubble::after{content:"";position:absolute;bottom:-13px;border:13px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.l::after{left:30px}.bubble.r::after{right:30px}
.big{position:absolute;left:0;right:0;top:9%;z-index:7;text-align:center;pointer-events:none;font-family:var(--fd);font-size:clamp(44px,14.5vw,76px);line-height:1;color:#fff;opacity:0;text-shadow:0 5px 0 #7a1fd1,0 0 30px #b36bff}
.big.pop{animation:bigpop .5s cubic-bezier(.2,1.6,.4,1) forwards}
.big.win{color:var(--gold);text-shadow:0 5px 0 #b35a00,0 0 34px rgba(255,200,0,.9)}
.big.lose{color:#ff5a7a;text-shadow:0 5px 0 #6b0020,0 0 34px rgba(255,40,90,.9)}
.big.draw{color:var(--cyan);text-shadow:0 5px 0 #005d6b,0 0 30px rgba(34,228,255,.9)}
.big.small{font-size:clamp(30px,10vw,50px)}
.big.xs{font-size:clamp(24px,8vw,40px);padding:0 14px;line-height:1.1}
.big.out{opacity:0 !important;transition:opacity .3s}
.hand{position:absolute;top:34%;z-index:6;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:44px;
  background:radial-gradient(circle at 40% 35%,#fff 0,#ffe9a8 55%,#ffb000 100%);box-shadow:0 0 0 4px #fff,0 8px 0 4px rgba(0,0,0,.3),0 0 30px rgba(255,210,63,.8);
  opacity:0;transform:scale(.3);transition:opacity .2s,transform .25s var(--spring)}
.hand span{display:inline-block;line-height:1}
.hand.l{left:calc(50% - 96px)}.hand.r{right:calc(50% - 96px)}
.hand.r>span{transform:scaleX(-1)}
.hand .two{font-size:27px;letter-spacing:-3px}
.hand.show{opacity:1;transform:scale(1)}
.hand.pump{animation:pump .42s ease}
.hand.reveal{animation:reveal .5s cubic-bezier(.2,1.6,.4,1)}
.hand.win{box-shadow:0 0 0 5px var(--gold),0 8px 0 4px rgba(0,0,0,.3),0 0 40px 8px rgba(255,210,63,.9)}
.hand.lose{filter:grayscale(.7) brightness(.75);transform:scale(.85)}
.vsmid{position:absolute;top:36%;left:50%;transform:translateX(-50%);z-index:5;font-family:var(--fd);font-size:24px;color:#fff;opacity:0;transition:opacity .2s;text-shadow:0 0 14px var(--pink)}
.vsmid.show{opacity:.9}
.fxl{position:absolute;inset:0;pointer-events:none;z-index:9}
.ftx{position:absolute;font-family:var(--fd);font-size:21px;white-space:nowrap;animation:floatUp 1.5s ease-out forwards}
.ftx.lol{color:var(--gold);text-shadow:0 3px 0 #b35a00,0 0 14px rgba(255,200,0,.7)}
.ftx.boo{color:#8fe3ff;text-shadow:0 3px 0 #0b4a77,0 0 14px rgba(80,200,255,.7)}
.emo{position:absolute;font-size:26px;animation:rise 1.8s ease-out forwards}
.skip{position:absolute;bottom:1.5%;left:0;right:0;text-align:center;font-size:11px;font-weight:800;color:rgba(255,255,255,.55);opacity:0;transition:opacity .2s;z-index:9;pointer-events:none}
.skip.on{opacity:1}
.controls{position:relative;z-index:10;padding:6px 12px 14px;background:linear-gradient(180deg,transparent,rgba(6,2,16,.85) 40%)}
.hint{width:max-content;margin:0 auto 9px;padding:5px 15px;border-radius:999px;font-weight:900;font-size:13px;color:#2b1100;background:linear-gradient(135deg,#ffe98a,#ffb42b);
  box-shadow:0 8px 18px -6px rgba(255,170,40,.7);opacity:0;transform:translateY(6px) scale(.9);transition:.25s var(--spring)}
.hint.on{opacity:1;transform:none;animation:hintPulse 1.3s ease-in-out infinite}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:22px;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.04));border:1px solid var(--stroke);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 12px 24px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .12s var(--ease),opacity .2s,border-color .2s,box-shadow .2s}
.pick[data-c="tosh"]{--pc:#8aa4ff}.pick[data-c="qaychi"]{--pc:#ff6fb0}.pick[data-c="qogoz"]{--pc:#4ff0cc}
.pick .disc{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:32px;line-height:1;
  background:radial-gradient(circle at 35% 28%,#fff 0,var(--pc) 72%);box-shadow:0 10px 22px -8px var(--pc),inset 0 -5px 10px rgba(0,0,0,.18)}
.pick .t{font-family:var(--fd);font-size:12px;letter-spacing:.6px}
.pick:active{transform:scale(.93)}
.pick:disabled{opacity:.36}
.pick.chosen{opacity:1;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,63,.35),0 14px 30px -12px rgba(255,190,40,.9)}

/* ===== sheets & overlays ===== */
.ovl{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,2,16,0);pointer-events:none;visibility:hidden;
  transition:background .35s,visibility 0s linear .45s}
.ovl.show{background:rgba(6,2,16,.74);pointer-events:auto;visibility:visible;transition:background .35s}
.sheet{width:100%;max-height:100%;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  padding:12px 16px 18px;border-radius:28px 28px 0 0;background:linear-gradient(180deg,#27104f,#130731);border:1px solid var(--stroke);border-bottom:0;
  box-shadow:0 -24px 60px rgba(0,0,0,.55);transform:translateY(105%);transition:transform .5s var(--spring)}
.sheet::-webkit-scrollbar{display:none}
.ovl.show .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);margin-bottom:4px}
.fin-t{font-family:var(--fd);font-size:clamp(28px,9vw,44px);line-height:1.05;background:linear-gradient(180deg,#fff7a8,#ffae00 60%,#ff5e00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #8a1a10)}
.fin-t.sad{background:linear-gradient(180deg,#e0f7ff,#6fcfff 60%,#2a7fd6);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 #0d2f66)}
.fin-sc{display:flex;align-items:center;gap:12px;font-family:var(--fd);font-size:28px}
.fin-sc .av{width:40px;height:40px;border-radius:12px}
.fin-ch{display:flex;align-items:flex-end;justify-content:center;width:100%;max-width:380px}
.fin-w{position:relative;width:50%}.fin-l{width:34%;opacity:.92}
.fin-w svg,.fin-l svg{width:100%;height:auto;display:block;overflow:visible;transform-origin:50% 96%}
.fin-w svg{animation:laughS .24s ease-in-out infinite}
.fin-l svg{animation:sob .55s ease-in-out infinite}
.crown{position:absolute;top:-6%;left:50%;font-size:42px;animation:crown 1.2s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.q{width:100%;max-width:400px;padding:10px 14px 12px;border-radius:16px;background:#fff;color:var(--ink);font-weight:800;font-size:14.5px;line-height:1.35;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.q b{display:block;font-family:var(--fd);font-weight:400;font-size:11px}
.q.alt{background:#e3f5ff}
.sheet .btns{width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px;margin-top:4px}

#champ{align-items:center;background:rgba(6,2,16,0)}
#champ.show{background:rgba(6,2,16,.97)}
.chbox{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;text-align:center;opacity:0;transform:scale(.9);transition:.5s var(--spring)}
#champ.show .chbox{opacity:1;transform:none}
.rays{position:absolute;top:18%;left:50%;width:560px;height:560px;margin-left:-280px;margin-top:-280px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,210,63,.18) 0 10deg,transparent 10deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 65%);mask-image:radial-gradient(circle,#000 20%,transparent 65%);animation:spin 18s linear infinite}
.trophy{position:relative;width:110px;height:110px;animation:trophy 2.4s ease-in-out infinite;filter:drop-shadow(0 12px 24px rgba(255,170,0,.55))}
.ch-t{position:relative;font-family:var(--fd);font-size:clamp(26px,8.5vw,40px);line-height:1.05;background:linear-gradient(180deg,#fff7a8,#ffae00 60%,#ff5e00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #8a1a10)}
.ch-n{position:relative;font-family:var(--fd);font-size:18px}
.ch-art{position:relative;width:46%;max-width:210px}
.ch-art svg{width:100%;height:auto;display:block;overflow:visible;transform-origin:50% 96%;animation:laughS .24s ease-in-out infinite}
.chbox .btns{position:relative;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;margin-top:6px}

#modal{align-items:center;padding:24px}
.mcard{width:100%;max-width:360px;padding:20px 18px 18px;border-radius:24px;background:linear-gradient(180deg,#2a1257,#160835);border:1px solid var(--stroke);text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.6);transform:scale(.85);opacity:0;transition:.35s var(--spring)}
#modal.show .mcard{transform:none;opacity:1}
.mcard .mi{font-size:40px;margin-bottom:6px}
.mcard h4{font-family:var(--fd);font-weight:400;font-size:18px;margin-bottom:6px}
.mcard p{font-weight:800;font-size:14px;color:var(--muted);margin-bottom:16px;line-height:1.4}

#toast{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));z-index:40;transform:translate(-50%,-140%);padding:10px 16px;border-radius:14px;font-weight:900;font-size:13.5px;
  background:rgba(20,8,48,.92);border:1px solid var(--stroke2);box-shadow:0 14px 30px rgba(0,0,0,.45);transition:transform .4s var(--spring);white-space:nowrap;pointer-events:none}
#toast.on{transform:translate(-50%,0)}

/* ===== stats & settings ===== */
.wrap{padding:6px 14px 18px;display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;border-radius:20px;background:var(--glass);border:1px solid var(--stroke);display:flex;flex-direction:column;gap:4px}
.tile .v{font-family:var(--fd);font-size:28px;line-height:1}
.tile .k{font-size:12px;font-weight:900;color:var(--muted)}
.tile.hl{background:linear-gradient(135deg,rgba(255,210,63,.18),rgba(255,255,255,.04));border-color:rgba(255,210,63,.45)}
.tile.hl .v{color:var(--gold)}
.card{padding:14px;border-radius:20px;background:var(--glass);border:1px solid var(--stroke)}
.card h5{font-family:var(--fd);font-weight:400;font-size:12.5px;letter-spacing:1px;color:var(--muted);margin-bottom:10px}
.fav{display:flex;align-items:center;gap:12px}
.fav .av{width:58px;height:58px;border-radius:16px}
.fav .fn{font-family:var(--fd);font-size:17px}
.fav .fs{font-size:12.5px;font-weight:800;color:var(--muted)}
.hr{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.07)}
.hr:first-of-type{border-top:0}
.hr .av{width:34px;height:34px;border-radius:10px}
.hr .hn{font-weight:900;font-size:13px;margin-bottom:4px}
.hr .hb{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.hr .hb i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--green),#b6ffe0)}
.hr .hv{font-family:var(--fd);font-size:12px;color:var(--muted);white-space:nowrap}
.empty{font-weight:800;color:var(--dim);font-size:13px;text-align:center;padding:10px 0}
.set{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke);text-align:left;width:100%}
.set .si{width:40px;height:40px;flex:0 0 40px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.08)}
.set .st{flex:1;min-width:0}
.set .st b{display:block;font-weight:900;font-size:14.5px}
.set .st span{font-size:12px;font-weight:800;color:var(--muted)}
.sw{position:relative;width:52px;height:30px;flex:0 0 52px;border-radius:999px;background:rgba(255,255,255,.18);transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .3s var(--spring)}
.set.on .sw{background:linear-gradient(135deg,var(--green),#10b981)}
.set.on .sw::after{transform:translateX(22px)}
.about{text-align:center;padding:16px 10px 4px}
.about .logo .l1{font-size:18px}.about .logo .l2{font-size:44px}
.about p{margin-top:8px;font-size:12px;font-weight:800;color:var(--dim);letter-spacing:1px}

/* ===== superpowers ===== */
.srow{display:flex;align-items:center;gap:6px}
.pp.r .srow{flex-direction:row-reverse}
.pwi{display:grid;place-items:center;width:21px;height:21px;border-radius:7px;font-size:12px;line-height:1;background:rgba(255,255,255,.14);border:1px solid var(--stroke2);transition:filter .3s,opacity .3s}
.pwi.spent{filter:grayscale(1);opacity:.3}
.pwb{position:relative;width:100%;display:flex;align-items:center;gap:10px;padding:7px 10px 7px 7px;margin-bottom:9px;border-radius:16px;text-align:left;
  background:#2a1760;background:linear-gradient(135deg,color-mix(in srgb,var(--c,#8b5cf6) 32%,transparent),rgba(255,255,255,.05));
  border:1px solid color-mix(in srgb,var(--c,#8b5cf6) 65%,transparent);transition:transform .12s var(--ease),opacity .25s,filter .25s}
.pwb .pi{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.15)}
.pwb .pt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pwb .pt b{font-family:var(--fd);font-weight:400;font-size:12.5px;letter-spacing:.5px}
.pwb .pt small{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwb .ps{flex:0 0 auto;font-family:var(--fd);font-size:10px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.pwb.ready{animation:pwGlow 1.8s ease-in-out infinite}
.pwb.ready .ps{background:linear-gradient(135deg,#ffe98a,#ff8a1f);color:#2b1100}
.pwb.armed{background:linear-gradient(135deg,#ffe98a,#ffb42b 55%,#ff6a2b);border-color:transparent;color:#2b1100;box-shadow:0 10px 24px -10px rgba(255,150,30,.9)}
.pwb.armed .pt small{color:#5a2a00}.pwb.armed .ps{background:rgba(0,0,0,.18);color:#2b1100}.pwb.armed .pi{background:rgba(255,255,255,.45)}
.pwb.spent,.pwb.lock{opacity:.5;filter:grayscale(.65)}
.pwb.off{opacity:.25;filter:grayscale(1)}
.pwb:active{transform:scale(.98)}
.pwb:disabled{pointer-events:none}
.pwban{position:absolute;left:50%;top:4%;z-index:9;width:max-content;max-width:92%;display:flex;align-items:center;gap:11px;padding:10px 16px 11px 10px;border-radius:20px;text-align:left;
  background:#2a1760;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 72%,#1a0b3d),#1a0b3d 85%);border:2px solid var(--c);
  box-shadow:0 0 34px color-mix(in srgb,var(--c) 70%,transparent),0 14px 30px rgba(0,0,0,.45);transform:translate(-50%,0) scale(.5);opacity:0;transition:.35s var(--spring);pointer-events:none}
.pwban.on{transform:translate(-50%,0) scale(1);opacity:1}
.pwban .pbi{width:46px;height:46px;flex:0 0 46px;border-radius:14px;display:grid;place-items:center;font-size:27px;background:rgba(255,255,255,.2);animation:pwSpin .6s var(--spring)}

let AC=null, master=null, MUTED=false;
function ensureAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);}catch(e){AC=null}}
  if(AC&&AC.state==="suspended")AC.resume();
}
function tone(f,dur,type="sine",vol=.2,when=0,slide){
  if(!AC||MUTED)return;
  const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(master);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol,when=0,freq=1500){
  if(!AC||MUTED)return;
  const t=AC.currentTime+when,len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  src.buffer=buf;f.type="bandpass";f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f).connect(g).connect(master);src.start(t);src.stop(t+dur);
}

/* Murojaat: Jasur hammaga "sen"; Soliha Zarinaga "sen", qolganlarga "siz"; qolganlar Soliha va Jasur akaga "siz" */
function isFormal(k,tk){
  if(k==="sardor")return true;
  if(k==="jasur")return false;
  if(k==="soliha")return tk!=="zarina";
  return tk==="jasur"||tk==="soliha";
}
function fmt(str,k,tk){
  const f=isFormal(k,tk);
  const target=k==="sardor"?NICK[tk]:(tk==="jasur")?"Jasur aka":CH[tk].name;
  return str.replace(/\[([^\]|]*)\|([^\]]*)\]/g,(m,a,b)=>f?b:a).replace(/\{t\}/g,target);
}
function line(k,type,tk){
  const du=DUEL[k]&&DUEL[k][tk]&&DUEL[k][tk][type];
  if(du&&Math.random()<.55)return fmt(rnd(du),k,tk);
  const arr=LINES[k][type];let s,tries=0;
  do{s=rnd(arr);tries++}while(arr.length>1&&lastLine[k+type]===s&&tries<6);
  lastLine[k+type]=s;return fmt(s,k,tk);
}

function openSelect(mode){SEL.mode=mode;SEL.step=1;SEL.p=null;SEL.cur=rnd(KEYS);renderSelect(true);go("select")}
function renderSelect(anim){
  const st=SEL.step,m=SEL.mode,two=m!=="tour";
  $("#sTitle").textContent=m==="duo"?(st===1?"1-O'YINCHI QAHRAMONI":"2-O'YINCHI QAHRAMONI"):st===1?(m==="quick"?"QAHRAMONINGNI TANLA":"TURNIR QAHRAMONI"):"RAQIBINGNI TANLA";
  $("#sSteps").innerHTML=two?`<i class="on"></i><i class="${st===2?"on":""}"></i>`:`<i class="on"></i>`;
  $("#heroes").innerHTML=KEYS.map(k=>{
    const lock=st===2&&k===SEL.p;
    return `<button class="ht ${k===SEL.cur?"sel":""} ${lock?"lock":""}" data-k="${k}" style="--c:${CH[k].accent}">${lock?`<span class="tag">${m==="duo"?"1-O'Y":"SEN"}</span>`:""}${avHTML(k,k===SEL.cur?"laugh":"idle")}<span class="n">${CH[k].name}</span></button>`;
  }).join("");
  $$("#heroes .ht").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.k;if(k===SEL.cur)return;
    ensureAudio();sfx.select();vib(10);SEL.cur=k;renderSelect(true);
  }));
  preview(SEL.cur,anim);
  $("#sRnd").style.display=(two&&st===2)?"":"none";
  $("#sGo").textContent=two?(st===1?"DAVOM ETISH":"JANGGA KIRISH ⚔️"):"TURNIRNI BOSHLASH 🏆";
}
function preview(k,anim){
  const c=CH[k],pv=$("#pv");pv.style.setProperty("--c",c.accent);
  const art=$("#pvArt");art.innerHTML=charSVG(k,SEL.step===2?"tense":"idle");
  if(anim){art.classList.remove("pop");void art.offsetWidth;art.classList.add("pop")}
  $("#pvName").textContent=c.name;$("#pvTag").textContent=c.tag;$("#pvQ").textContent="«"+QUOTE[k]+"»";
  const P=POWERS[k];$("#pvPw").innerHTML=`<span class="pi">${P.ic}</span><div><b>⚡ ${P.nm}</b><small>${P.ds}</small></div>`;
  $("#pvTr").innerHTML=TR_LBL.map((l,i)=>`<span>${l}</span><div class="bar"><i></i></div>`).join("");
  requestAnimationFrame(()=>requestAnimationFrame(()=>$$("#pvTr .bar i").forEach((b,i)=>b.style.width=TRAITS[k][i]+"%")));
}
$("#sBack").addEventListener("click",()=>{tapFx();if(SEL.step===2){SEL.step=1;SEL.cur=SEL.p;renderSelect(true)}else go("home")});
$("#sRnd").addEventListener("click",()=>{ensureAudio();sfx.select();SEL.cur=rnd(KEYS.filter(k=>k!==SEL.p&&k!==SEL.cur));renderSelect(true)});
$("#sGo").addEventListener("click",()=>{
  tapFx();
  if(SEL.mode==="quick"||SEL.mode==="duo"){
    if(SEL.step===1){SEL.p=SEL.cur;SEL.step=2;SEL.cur=rnd(KEYS.filter(k=>k!==SEL.p));renderSelect(true)}
    else startMatch(SEL.p,SEL.cur,SEL.mode);
  }else{newTour(SEL.cur);go("bracket");renderBracket();toast("Turnir boshlandi! Omad 🍀")}
});

/* ================= TOURNAMENT ================= */
let T=null;
function newTour(p){
  const order=shuffle(KEYS);
  const r0=[];for(let i=0;i<8;i+=2)r0.push({a:order[i],b:order[i+1],w:null,sa:0,sb:0});
  T={p,stage:0,rounds:[r0,[],[]],alive:true,champ:null,revealing:false};
  DB.stats.tours++;save();
}
function myMatch(){return T.rounds[T.stage].find(m=>m.a===T.p||m.b===T.p)}
function simMatch(m){const aw=Math.random()<.5,l=Math.random()<.45?1:0;m.w=aw?m.a:m.b;if(aw){m.sa=2;m.sb=l}else{m.sb=2;m.sa=l}}
function sideHTML(m,k,right){
  if(!k)return `<div class="side ${right?"r":""} tbd"><span class="av">?</span><span class="nm">Kutilmoqda</span></div>`;
  const st=m.w?(m.w===k?"won":"lost"):"";
  const e=m.w?(m.w===k?"laugh":"cry"):"idle";
  return `<div class="side ${right?"r":""} ${st}">${avHTML(k,e)}<span class="nm">${CH[k].name}${k===T.p?'<span class="you">SEN</span>':""}</span></div>`;
}
function renderBracket(flash){
  if(!T)return;
  let st="";
  for(let i=0;i<3;i++){
    const done=i<T.stage||!!T.champ, on=i===T.stage&&!T.champ;
    st+=`<div class="tstep ${done?"done":""} ${on?"on":""}"><i>${done?"✓":i+1}</i>${STAGE_SHORT[i]}</div><span class="tline ${done?"done":""}"></span>`;
  }
  st+=`<div class="tstep ${T.champ?"on":""}"><i>🏆</i>Kubok</div>`;
  $("#tsteps").innerHTML=st;
  let h="";
  for(let i=0;i<3;i++){
    const r=T.rounds[i],cnt=[4,2,1][i];
    const list=r.length?r:Array.from({length:cnt},()=>({a:null,b:null,w:null,sa:0,sb:0}));
    h+=`<div class="bsec ${i===T.stage&&!T.champ?"cur":""}" id="bs-${i}"><h3>${STAGES[i]}</h3>`+list.map((m,j)=>{
      const me=(m.a===T.p||m.b===T.p)&&!m.w&&i===T.stage&&T.alive&&!!m.a;
      const sc=m.w?`<div class="sc">${m.sa} : ${m.sb}</div>`:`<div class="sc vs">VS</div>`;
      return `<div class="mc ${me?"me":""}" id="mc-${i}-${j}">${me?'<span class="melabel">SENING JANGING</span>':""}${sideHTML(m,m.a,0)}${sc}${sideHTML(m,m.b,1)}</div>`;
    }).join("")+`</div>`;
  }
  h+=`<div class="bsec" id="bs-3"><h3>CHEMPION</h3><div class="champslot ${T.champ?"won":""}">${T.champ?avHTML(T.champ,"laugh"):'<span class="av empty">🏆</span>'}<div class="cn">${T.champ?CH[T.champ].name:"???"}</div></div></div>`;
  $("#blist").innerHTML=h;
  if(flash){const el=$("#"+flash);if(el)el.classList.add("flash")}
  const cta=$("#bCta"),sub=$("#bSub");cta.disabled=false;
  if(T.revealing){cta.textContent="NATIJALAR KELMOQDA...";cta.disabled=true;sub.style.display="none"}
  else if(T.champ){cta.textContent="YANGI TURNIR 🏆";sub.textContent="BOSH MENYU";sub.style.display=""}
  else if(!T.alive){cta.textContent="TURNIRNI OXIRIGACHA KO'RISH";sub.textContent="BOSH MENYU";sub.style.display=""}
  else{cta.textContent=`▶  ${STAGES[T.stage]}: JANGGA`;sub.textContent="Turnirni qaytadan boshlash";sub.style.display=""}
  const target=$("#bs-"+(T.champ?3:T.stage)),sc=$("#bscroll");
  if(target)sc.scrollTo({top:Math.max(0,target.offsetTop-6),behavior:"smooth"});
}
$("#bBack").addEventListener("click",()=>{tapFx();go("home")});
$("#bCta").addEventListener("click",()=>{
  tapFx();if(!T||T.revealing)return;
  if(T.champ){openSelect("tour");return}
  if(!T.alive){simulateRest();return}
  const m=myMatch(),opp=m.a===T.p?m.b:m.a;
  startMatch(T.p,opp,"tour",STAGES[T.stage]);
});
$("#bSub").addEventListener("click",async()=>{
  tapFx();if(!T)return;
  if(T.champ||!T.alive){go("home");return}
  if(await ask("🔄","Turnirni qayta boshlaysizmi?","Hozirgi turnir natijalari o'chadi.","Ha, qayta","Yo'q"))openSelect("tour");
});
async function revealOthers(){
  T.revealing=true;renderBracket();
  const r=T.rounds[T.stage];
  for(let j=0;j<r.length;j++){
    if(r[j].w)continue;
    await sleep(520);simMatch(r[j]);sfx.pop();vib(12);renderBracket(`mc-${T.stage}-${j}`);
  }
  await sleep(350);T.revealing=false;
}
function advanceStage(){
  const cur=T.rounds[T.stage];
  if(T.stage===2){
    T.champ=cur[0].w;
    if(T.champ===T.p){DB.stats.titles++;save()}
    renderBracket();setTimeout(showChampion,650);return;
  }
  const nx=[];for(let i=0;i<cur.length;i+=2)nx.push({a:cur[i].w,b:cur[i+1].w,w:null,sa:0,sb:0});
  T.rounds[T.stage+1]=nx;T.stage++;renderBracket();
}
async function tourAfterMatch(won,sp,so){
  const m=myMatch(),pa=m.a===T.p;
  m.w=won?T.p:(pa?m.b:m.a);
  if(pa){m.sa=sp;m.sb=so}else{m.sa=so;m.sb=sp}
  if(!won)T.alive=false;
  go("bracket");renderBracket(`mc-${T.stage}-${T.rounds[T.stage].indexOf(m)}`);
  await sleep(500);
  await revealOthers();
  advanceStage();
  if(!T.champ)toast(won?`🎉 ${STAGE_TO[T.stage]} chiqding!`:"😭 Turnirdan chiqding");
}
async function simulateRest(){
  while(T&&!T.champ){await revealOthers();advanceStage();await sleep(450)}
}
function showChampion(){
  const me=T.champ===T.p,f=T.rounds[2][0],ru=f.a===T.champ?f.b:f.a;
  $("#chT").textContent=me?"SEN CHEMPIONSAN!":"TURNIR CHEMPIONI";
  $("#chArt").innerHTML=charSVG(T.champ,"laugh");
  $("#chN").textContent=CH[T.champ].name;
  const q=$("#chQ");q.innerHTML=`<b style="color:${CH[T.champ].accent}">${CH[T.champ].name}</b>`;q.append(document.createTextNode(line(T.champ,"fwin",ru)));
  $("#champ").classList.add("show");
  sfx.trophy();setTimeout(()=>sfx.laugh(),900);vib([100,60,100,60,250]);
  confetti(me?220:90);if(me)setTimeout(()=>confetti(120),900);
}
$("#chNew").addEventListener("click",()=>{tapFx();$("#champ").classList.remove("show");openSelect("tour")});
$("#chHome").addEventListener("click",()=>{tapFx();$("#champ").classList.remove("show");go("home")});

/* ================= STATS ================= */
function recordMatch(p,won){
  const s=DB.stats;s.played++;
  if(won){s.wins++;s.streak++;s.best=Math.max(s.best,s.streak)}else{s.losses++;s.streak=0}
  const h=s.hero[p]||(s.hero[p]={p:0,w:0});h.p++;if(won)h.w++;
  save();
}
function renderStats(){
  const s=DB.stats,pct=s.played?Math.round(s.wins/s.played*100):0;
  const heroes=KEYS.map(k=>({k,...(s.hero[k]||{p:0,w:0})}));
  const fav=heroes.filter(h=>h.p>0).sort((a,b)=>b.p-a.p)[0];
  let h=`<div class="tiles">
    <div class="tile hl"><div class="v">${s.titles}</div><div class="k">🏆 Turnir kuboklari</div></div>
    <div class="tile"><div class="v">${pct}%</div><div class="k">G'alaba foizi</div></div>
    <div class="tile"><div class="v">${s.played}</div><div class="k">O'ynalgan janglar</div></div>
    <div class="tile"><div class="v">${s.wins} / ${s.losses}</div><div class="k">G'alaba / mag'lubiyat</div></div>
    <div class="tile"><div class="v">${s.best}</div><div class="k">🔥 Eng uzun seriya</div></div>
    <div class="tile"><div class="v">${s.tours}</div><div class="k">Qatnashgan turnirlar</div></div>
    <div class="tile"><div class="v">${s.duo||0}</div><div class="k">👥 Do'st bilan janglar</div></div>
    <div class="tile"><div class="v">${s.powers||0}</div><div class="k">⚡ Superkuch ishlatilgan</div></div>
  </div>`;
  h+=`<div class="card"><h5>SEVIMLI QAHRAMON</h5>${fav?`<div class="fav">${avHTML(fav.k,"laugh")}<div><div class="fn" style="color:${CH[fav.k].accent}">${CH[fav.k].name}</div><div class="fs">${fav.p} ta jang · ${fav.w} ta g'alaba</div></div></div>`:`<div class="empty">Hali jang o'ynalmagan — arenaga kir! ⚔️</div>`}</div>`;
  h+=`<div class="card"><h5>QAHRAMONLAR BO'YICHA</h5>`+heroes.sort((a,b)=>b.p-a.p).map(x=>{
    const r=x.p?Math.round(x.w/x.p*100):0;
    return `<div class="hr">${avHTML(x.k)}<div><div class="hn">${CH[x.k].name}</div><div class="hb"><i style="width:${r}%"></i></div></div><div class="hv">${x.w}/${x.p}</div></div>`;
  }).join("")+`</div>`;
  $("#stWrap").innerHTML=h;
}

/* ================= MATCH ================= */
const M={p:null,o:null,sp:0,so:0,busy:true,tok:0,mode:"quick",stageName:null,round:1,pw:null};
let RS=null;
const stage=$("#stage"),bL=$("#bL"),bR=$("#bR"),bigEl=$("#big"),hL=$("#hL"),hR=$("#hR"),fxl=$("#fxl"),skipEl=$("#skip");
let skipFn=null;
function wait(ms){return new Promise(res=>{const t=setTimeout(done,ms);function done(){clearTimeout(t);skipFn=null;res()}skipFn=done;})}
stage.addEventListener("pointerdown",()=>{if(skipFn)skipFn()});
const HOLD=()=>DB.settings.fast?.45:1;
function updMute(){$("#gMute").innerHTML=MUTED?IC.mute:IC.snd}
const other=s=>s==="L"?"R":"L";
const heroOf=s=>s==="L"?M.p:M.o;
const starsOf=s=>s==="L"?M.sp:M.so;
function addStars(s,n){if(s==="L")M.sp=Math.max(0,Math.min(2,M.sp+n));else M.so=Math.max(0,Math.min(2,M.so+n));updStars()}
function res(a,b){return a===b?0:(BEATS[a]===b?1:-1)}
function outcome(a,b){if(Array.isArray(a))return Math.max(...a.map(x=>res(x,b)));if(Array.isArray(b))return -Math.max(...b.map(x=>res(x,a)));return res(a,b)}
function counter(pk){let best="tosh",bv=9;for(const y of shuffle(["tosh","qaychi","qogoz"])){const v=Array.isArray(pk)?Math.max(...pk.map(x=>res(x,y))):res(pk,y);if(v<bv){bv=v;best=y}}return best}
const HNAME={tosh:"TOSH",qaychi:"QAYCHI",qogoz:"QOG'OZ"};
const handTxt=pk=>Array.isArray(pk)?pk.map(x=>EMO[x]).join(""):EMO[pk];
const handName=pk=>Array.isArray(pk)?pk.map(x=>HNAME[x]).join(" + "):HNAME[pk];
const armed=(S,k)=>RS&&RS.arm[S]&&heroOf(S)===k;
const isDuo=()=>M.mode==="duo";

function startMatch(p,o,mode,stageName){
  M.tok++;M.busy=true;RS=null;skipFn=null;
  M.p=p;M.o=o;M.mode=mode;M.stageName=stageName||null;
  $("#final").classList.remove("show");showVS();
}
function showVS(){
  M.tok++;const tok=M.tok;
  const p=CH[M.p],o=CH[M.o],duo=isDuo();
  $("#vs").innerHTML=`${M.stageName?`<div class="vsstage">${M.stageName}</div>`:""}
    <div class="vsh l" style="--c:${p.accent}"><div class="cs">${charSVG(M.p,"tense")}</div><div class="vn">${p.name}</div><div class="vt">${duo?"1-O'YINCHI":"SEN"}</div></div>
    <div class="vsh r" style="--c:${o.accent}"><div class="vn">${o.name}</div><div class="vt">${duo?"2-O'YINCHI":"RAQIB"}</div><div class="cs">${charSVG(M.o,"tense")}</div></div>
    <div class="vstext">VS</div><div class="flash"></div>`;
  go("vs");ensureAudio();sfx.whoosh();
  setTimeout(()=>{if(tok!==M.tok)return;sfx.boom();vib(80);shake()},420);
  setTimeout(()=>{if(tok!==M.tok)return;startGame()},2150);
}
function setExpr(side,e){const el=side==="L"?$("#cL"):$("#cR");el.className="char "+e;el.innerHTML=charSVG(heroOf(side),e)}
function updStars(){
  const f=(id,n)=>$$(id+" i").forEach((s,i)=>{const on=i<n;if(on&&!s.classList.contains("on"))s.classList.add("on");if(!on)s.classList.remove("on")});
  f("#stP",M.sp);f("#stO",M.so);
}
function setRound(t){$("#rnd").textContent=t}
let bigT=null;
function big(text,cls="",hold=0){clearTimeout(bigT);bigEl.className="big "+cls;bigEl.textContent=text;void bigEl.offsetWidth;bigEl.classList.add("pop");if(hold)bigT=setTimeout(()=>bigEl.classList.add("out"),hold)}
function hideBig(){bigEl.classList.add("out")}
function shake(){app.classList.remove("shake");void app.offsetWidth;app.classList.add("shake")}
function hideBubbles(){bL.classList.remove("show");bR.classList.remove("show")}
function typeText(el,text){
  return new Promise(res=>{
    const ch=[...text];let i=0;
    const iv=setInterval(()=>{i++;el.textContent=ch.slice(0,i).join("");if(i%3===0)sfx.blip();if(i>=ch.length){clearInterval(iv);skipFn=null;res()}},DB.settings.fast?14:24);
    skipFn=()=>{clearInterval(iv);el.textContent=text;skipFn=null;res()};
  });
}
async function say(side,k,text,hold=1500){
  const b=side==="L"?bL:bR,o=side==="L"?bR:bL;
  const bi=text.indexOf("p*****");if(bi>=0)setTimeout(()=>sfx.bleep(),bi*(DB.settings.fast?14:24));
  o.classList.remove("show");
  const who=b.querySelector(".who");who.textContent=CH[k].name;who.style.color=CH[k].accent;
  const tx=b.querySelector(".tx");tx.textContent="";
  b.classList.remove("show");void b.offsetWidth;b.classList.add("show");
  skipEl.classList.add("on");
  await typeText(tx,text);
  await wait((hold+text.length*22)*HOLD());
  skipEl.classList.remove("on");
}
function burst(side,words,cls,n=4){
  const f=side==="L"?$("#fL"):$("#fR"),sr=stage.getBoundingClientRect(),r=f.getBoundingClientRect();
  for(let i=0;i<n;i++)setTimeout(()=>{
    const s=document.createElement("div");s.className="ftx "+cls;s.textContent=words[i%words.length];
    s.style.left=(r.left-sr.left+r.width*(.3+Math.random()*.4))+"px";s.style.top=(r.top-sr.top+r.height*(.02+Math.random()*.18))+"px";
    s.style.setProperty("--x",(Math.random()*70-35)+"px");s.style.setProperty("--r",(Math.random()*26-13)+"deg");
    fxl.appendChild(s);setTimeout(()=>s.remove(),1600);
  },i*280);
}
function crowdHype(){
  const c=$("#crowd");c.classList.add("hype");setTimeout(()=>c.classList.remove("hype"),2200);
  const sr=stage.getBoundingClientRect();
  for(let i=0;i<9;i++)setTimeout(()=>{
    const e=document.createElement("div");e.className="emo";e.textContent=rnd(["😂","🤣","😆","👏","🔥"]);
    e.style.left=(Math.random()*sr.width*.9)+"px";e.style.top=(sr.height*(.6+Math.random()*.12))+"px";
    e.style.setProperty("--r",(Math.random()*40-20)+"deg");fxl.appendChild(e);setTimeout(()=>e.remove(),1900);
  },i*110);
}
function crowdSVG(){
  let s='<svg viewBox="0 0 400 90" preserveAspectRatio="xMidYMax slice">';
  for(let row=0;row<2;row++){
    const y=row?74:54,sc=row?1.15:.9,col=row?"#0b0520":"#1d0d42";
    for(let x=-10;x<420;x+=row?26:21){
      const hx=x+(Math.random()*6-3),hy=y+(Math.random()*6-3),d=(Math.random()*1.4).toFixed(2);
      s+=`<g class="cp" style="animation-delay:-${d}s"><circle cx="${hx}" cy="${hy-16*sc}" r="${8*sc}" fill="${col}"/><path d="M${hx-13*sc} ${hy+30} Q${hx-13*sc} ${hy-6*sc} ${hx} ${hy-6*sc} Q${hx+13*sc} ${hy-6*sc} ${hx+13*sc} ${hy+30} Z" fill="${col}"/></g>`;
      if(!row&&Math.random()<.18)s+=`<circle class="flashp" cx="${hx+7}" cy="${hy-22}" r="2.2" fill="#fff" style="animation-delay:-${(Math.random()*3).toFixed(2)}s"/>`;
    }
  }
  return s+"</svg>";
}
function setPicks(on,keep){$$(".pick").forEach(b=>{b.disabled=!on;if(on&&!keep)b.classList.remove("chosen")});$("#hint").classList.toggle("on",on)}
function setHand(h,pk){h.firstElementChild.innerHTML=Array.isArray(pk)?`<span class="two">${handTxt(pk)}</span>`:EMO[pk]}
function resetHands(){[hL,hR].forEach(h=>{h.className="hand "+(h===hL?"l":"r");h.firstElementChild.textContent="✊"});$("#vsmid").classList.remove("show")}
function hideMirror(){$("#mirror").classList.remove("on")}

/* ---------- power UI ---------- */
function powerAvailable(S){
  const h=heroOf(S),O=other(S);
  if(M.pw[S].used)return false;
  if(h==="jasur"&&starsOf(O)<1)return false;
  if(h==="shaxzod"&&M.pw[O].spent)return false;
  return true;
}
function renderPowerBtn(S){
  const b=$("#pwb");
  if(!S){b.className="pwb off";b.disabled=true;return}
  const h=heroOf(S),P=POWERS[h];
  b.style.setProperty("--c",CH[h].accent);
  b.querySelector(".pi").textContent=P.ic;b.querySelector(".pt b").textContent=P.nm;
  let st,small=P.ds,cls;
  if(RS.arm[S]){st="FAOL ✓";cls="armed"}
  else if(M.pw[S].used){st="ISHLATILDI";cls="spent";if(RS.blocked[S])small="Raqib 🤷 FARQI YO'Q bilan o'chirdi"}
  else if(!powerAvailable(S)){st="HOZIR EMAS";cls="lock";small=h==="jasur"?"Raqibda hali yulduz yo'q":h==="shaxzod"?"Raqibning kuchi allaqachon ishlatilgan":P.ds}
  else{st="1 MARTA";cls="ready"}
  b.querySelector(".pt small").textContent=small;b.querySelector(".ps").textContent=st;
  b.className="pwb "+cls;b.disabled=cls!=="ready";
}
function updPwInd(){
  ["L","R"].forEach(S=>{
    const el=$(S==="L"?"#pwiP":"#pwiO"),k=heroOf(S);if(!k||!M.pw)return;
    el.textContent=POWERS[k].ic;el.title=POWERS[k].nm;
    const self=!isDuo()&&S==="L";
    el.classList.toggle("spent",M.pw[S].spent||(self&&M.pw[S].used));
  });
}
function showMirrorFor(S){
  const O=other(S),m=$("#mirror");
  if(RS.blocked[S])m.innerHTML=`<span class="mh">🌫️</span>Ko'zgu xiralashdi — raqib 🤷 ishlatgan!`;
  else m.innerHTML=`🪞 Ko'zguda ${CH[heroOf(O)].name}:<span class="mh">${handTxt(RS.pick[O])}</span>${handName(RS.pick[O])}`;
  m.classList.add("on");
}
function setHint(S){
  const h=heroOf(S);
  let t=isDuo()?`${S==="L"?1:2}-o'yinchi, tanla! 🙈`:"Tanla! 👇";
  if(RS.arm[S]&&h==="abdurayim")t=`Ikkita qo'l tanla 🙌 (${RS.pair.length}/2)`;
  else if(RS.arm[S])t=`${POWERS[h].ic} ${POWERS[h].nm} faol — tanla!`;
  $("#hint").textContent=t;
}
async function announce(S,effect){
  const k=heroOf(S),P=POWERS[k],b=$("#pwban");
  hideBubbles();
  b.style.setProperty("--c",CH[k].accent);
  b.innerHTML=`<span class="pbi">${P.ic}</span><div><b>${P.nm}!</b><small>${effect}</small><i>${CH[k].name}: «${PWLINE[k]}»</i></div>`;
  b.classList.remove("on");void b.offsetWidth;b.classList.add("on");
  sfx.power();vib([30,40,30]);
  if(PWLINE[k].includes("p*****"))setTimeout(()=>sfx.bleep(),350);
  skipEl.classList.add("on");
  await wait(2100*HOLD());
  skipEl.classList.remove("on");
  b.classList.remove("on");await sleep(220);
}

/* ---------- match flow ---------- */
async function startGame(){
  M.tok++;const tok=M.tok;
  M.sp=0;M.so=0;M.busy=true;M.round=1;RS=null;
  M.pw={L:{used:false,spent:false},R:{used:false,spent:false}};
  const duo=isDuo();
  $("#hudP").textContent=CH[M.p].name;$("#hudO").textContent=CH[M.o].name;
  $("#hudP").style.color=CH[M.p].accent;$("#hudO").style.color=CH[M.o].accent;
  const aP=$("#avP"),aO=$("#avO");aP.style.setProperty("--c",CH[M.p].accent);aO.style.setProperty("--c",CH[M.o].accent);
  aP.innerHTML=avatarSVG(M.p);aO.innerHTML=avatarSVG(M.o);
  $("#nL").textContent=CH[M.p].name+(duo?" (1)":" (sen)");$("#nR").textContent=CH[M.o].name+(duo?" (2)":"");
  $("#stg").textContent=M.stageName||(duo?"DO'ST BILAN":"TEZKOR JANG");
  updStars();setRound("RAUND 1");hideBubbles();resetHands();setPicks(false);bigEl.className="big";fxl.innerHTML="";updMute();
  updPwInd();renderPowerBtn(null);hideMirror();$("#pwban").classList.remove("on");$("#cover").classList.remove("show");
  $("#crowd").innerHTML=crowdSVG();
  setExpr("L","idle");setExpr("R","idle");
  go("game");
  ["#fL","#fR"].forEach(id=>{const f=$(id);f.classList.remove("enter");void f.offsetWidth;f.classList.add("enter")});
  await sleep(750);if(tok!==M.tok)return;
  if(M.stageName){big(M.stageName,"small win",950);sfx.boom();vib(40);await sleep(1050);if(tok!==M.tok)return}
  big("RAUND 1","small",900);sfx.boom();vib(40);
  await sleep(1000);if(tok!==M.tok)return;
  await say("R",M.o,line(M.o,"intro",M.p));if(tok!==M.tok)return;
  await say("L",M.p,line(M.p,"intro",M.o));if(tok!==M.tok)return;
  hideBubbles();
  if(!DB.settings.seenPw){DB.settings.seenPw=true;save();toast("⚡ Har qahramonda 1 martalik superkuch bor!")}
  roundStart();
}
function aiPrepare(){
  const h=M.o,pw=M.pw.R;
  if(!pw.used){
    let p=.2+.08*(M.round-1);
    if(M.sp===1)p+=.35;
    if(["muhiddin","soliha","asad"].includes(h)&&M.sp===1)p+=.15;
    if(h==="jasur"&&M.sp<1)p=0;
    if(h==="zarina"&&M.sp<1)p*=.35;
    if(h==="shaxzod"&&M.pw.L.spent)p=0;
    if(Math.random()<Math.min(p,.9)){RS.arm.R=true;pw.used=true}
  }
  if(RS.arm.R&&h==="abdurayim"){const s=shuffle(["tosh","qaychi","qogoz"]);RS.pick.R=[s[0],s[1]]}
  else RS.pick.R=oppPick(h);
}
function roundStart(){
  RS={pick:{L:null,R:null},arm:{L:false,R:false},blocked:{L:false,R:false},queue:[],cur:null,pair:[]};
  resetHands();hideMirror();hideBubbles();
  setExpr("L","idle");setExpr("R","idle");
  $$(".pick").forEach(b=>b.classList.remove("chosen"));
  M.busy=false;
  if(isDuo()){RS.queue=["L","R"];nextPhase()}
  else{aiPrepare();humanPhase("L")}
}
function humanPhase(S){
  RS.cur=S;RS.pair=[];
  $$(".pick").forEach(b=>b.classList.remove("chosen"));
  if(RS.arm[S]&&heroOf(S)==="soliha"){
    const O=other(S);
    if(RS.arm[O]&&heroOf(O)==="shaxzod"){RS.arm[S]=false;RS.blocked[S]=true}
    showMirrorFor(S);
  }
  renderPowerBtn(S);setHint(S);setPicks(true);
}
function showCover(S,note){
  return new Promise(res=>{
    const k=heroOf(S),c=$("#cover"),n=S==="L"?1:2;
    c.style.setProperty("--c",CH[k].accent);
    $("#cvT").textContent=`${n}-O'YINCHI NAVBATI`;
    const av=$("#cvAv");av.style.setProperty("--c",CH[k].accent);av.innerHTML=avatarSVG(k,"tense");
    $("#cvN").textContent=CH[k].name;
    $("#cvP").textContent=note||`Telefonni ${n}-o'yinchiga bering. Raqib qaramasin! 🙈`;
    c.classList.add("show");
    $("#cvGo").onclick=()=>{tapFx();c.classList.remove("show");res()};
  });
}
function nextPhase(note){
  const S=RS.queue.shift();
  if(!S){reveal();return}
  hideMirror();setPicks(false);renderPowerBtn(null);
  $$(".pick").forEach(b=>b.classList.remove("chosen"));
  const tok=M.tok;
  showCover(S,note).then(()=>{if(tok===M.tok)humanPhase(S)});
}
$("#pwb").addEventListener("click",()=>{
  const S=RS&&RS.cur;if(!S||M.busy)return;
  const h=heroOf(S),O=other(S),pw=M.pw[S];
  if(pw.used||!powerAvailable(S))return;
  pw.used=true;RS.arm[S]=true;
  if(!isDuo()&&S==="L"){DB.stats.powers=(DB.stats.powers||0)+1;save()}
  ensureAudio();sfx.power();vib([20,30,20]);
  if(h==="soliha"){
    if(RS.arm[O]&&heroOf(O)==="shaxzod"){RS.arm[S]=false;RS.blocked[S]=true;showMirrorFor(S)}
    else if(!isDuo()||RS.pick[O]!=null)showMirrorFor(S);
    else{RS.cur=null;RS.queue.push(S);nextPhase(`🪞 ${CH[h].name} Ko'zgu ishlatdi! Endi avval sen tanlaysan.`);return}
  }
  renderPowerBtn(S);setHint(S);updPwInd();
});
function onPick(ch,btn){
  const S=RS&&RS.cur;if(!S||M.busy)return;
  ensureAudio();sfx.click();vib(15);
  if(RS.arm[S]&&heroOf(S)==="abdurayim"){
    if(RS.pair.includes(ch)){RS.pair=RS.pair.filter(x=>x!==ch);btn.classList.remove("chosen")}
    else{RS.pair.push(ch);btn.classList.add("chosen")}
    setHint(S);
    if(RS.pair.length<2)return;
    RS.pick[S]=RS.pair.slice();
  }else{btn.classList.add("chosen");RS.pick[S]=ch}
  RS.cur=null;
  $$(".pick").forEach(b=>b.disabled=true);$("#hint").classList.remove("on");renderPowerBtn(null);
  if(isDuo())setTimeout(()=>nextPhase(),380);else reveal();
}
$$(".pick").forEach(b=>b.addEventListener("click",()=>onPick(b.dataset.c,b)));

async function reveal(){
  M.busy=true;const tok=M.tok;
  hideMirror();$("#hint").classList.remove("on");renderPowerBtn(null);
  if(!isDuo()&&RS.arm.R&&M.o==="soliha"&&!(RS.arm.L&&M.p==="shaxzod"))RS.pick.R=counter(RS.pick.L);
  hideBubbles();hideBig();
  setExpr("L","tense");setExpr("R","tense");
  hL.classList.add("show");hR.classList.add("show");$("#vsmid").classList.add("show");
  await sleep(250);
  for(const [i,w] of ["DON!","DON!","ZIKI!"].entries()){
    if(tok!==M.tok)return;
    big(w,i===2?"win":"");
    [hL,hR].forEach(h=>{h.classList.remove("pump");void h.offsetWidth;h.classList.add("pump")});
    i<2?sfx.don():sfx.ziki();vib(i<2?30:60);
    await sleep(560);
  }
  if(tok!==M.tok)return;
  setHand(hL,RS.pick.L);setHand(hR,RS.pick.R);
  [hL,hR].forEach(h=>{h.classList.remove("pump");void h.offsetWidth;h.classList.add("reveal")});
  sfx.pop();hideBig();
  await sleep(650);if(tok!==M.tok)return;
  await resolveRound(tok);
}
function resultBig(W){
  if(isDuo())big(`${CH[heroOf(W)].name.toUpperCase()} YUTDI!`,"win xs",1500);
  else big(W==="L"?"YUTDING!":"YUTQAZDING!",W==="L"?"win":"lose small",1500);
}
async function resolveRound(tok){
  const alive=()=>tok===M.tok;
  // 1) FARQI YO'Q — cancels the opponent's power
  for(const S of ["L","R"]){
    if(!armed(S,"shaxzod"))continue;
    const O=other(S),had=RS.arm[O]||RS.blocked[O],on=CH[heroOf(O)].name;
    RS.arm[O]=false;M.pw[O].used=true;
    await announce(S,had?`${on}ning «${POWERS[heroOf(O)].nm}» kuchi o'chirildi!`:`${on} endi superkuch ishlata olmaydi!`);
    if(!alive())return;
  }
  ["L","R"].forEach(S=>{if(M.pw[S].used)M.pw[S].spent=true});updPwInd();
  // 2) JARIMA
  for(const S of ["L","R"]){
    if(!armed(S,"jasur"))continue;
    const O=other(S);addStars(O,-1);shake();
    await announce(S,`${CH[heroOf(O)].name} 1 yulduzidan ayrildi!`);if(!alive())return;
  }
  // 3) reveals that happen before the result
  for(const S of ["L","R"]){
    if(armed(S,"soliha")){await announce(S,"Raqibning qo'lini oldindan ko'rib oldi!");if(!alive())return}
    if(armed(S,"abdurayim")){await announce(S,`Ikki qo'l: ${handName(RS.pick[S])}`);if(!alive())return}
  }
  // 4) result
  let r=outcome(RS.pick.L,RS.pick.R);
  for(const S of ["L","R"]){
    if(!armed(S,"asad"))continue;
    if(r===0){r=S==="L"?1:-1;await announce(S,"Durang — g'alabaga aylandi!")}
    else await announce(S,"Durang chiqmadi — kuch behuda ketdi 😅");
    if(!alive())return;
  }
  if(r===0){
    big("DURANG!","draw",1200);sfx.draw();vib(25);
    setExpr("L","idle");setExpr("R","idle");
    await sleep(900);if(!alive())return;
    for(const S of ["L","R"])for(const k of ["sardor","zarina","muhiddin"])if(armed(S,k)){await announce(S,"Durang chiqdi — kuch behuda ketdi 😅");if(!alive())return}
    const side=Math.random()<.5?"L":"R",k=heroOf(side),t=heroOf(other(side));
    await say(side,k,line(k,"draw",t),1100);if(!alive())return;
    return endRound(tok);
  }
  const W=r>0?"L":"R",Lo=other(W),wk=heroOf(W),lk=heroOf(Lo);
  (W==="L"?hL:hR).classList.add("win");(W==="L"?hR:hL).classList.add("lose");
  resultBig(W);
  // SOQOL QALQONI — the loss does not count
  if(armed(Lo,"muhiddin")){
    await sleep(900);if(!alive())return;
    await announce(Lo,"Raund hisobga kirmadi!");if(!alive())return;
    setExpr(Lo,"laugh");setExpr(W,"cry");sfx.laugh();burst(Lo,CH[lk].lol,"lol",2);
    for(const k of ["sardor","zarina"])if(armed(W,k)){await announce(W,"Qalqonga urildi — kuch behuda ketdi 😅");if(!alive())return}
    await wait(1100*HOLD());
    return endRound(tok);
  }
  const pts=armed(W,"sardor")?2:1;
  addStars(W,pts);
  setExpr(W,"laugh");setExpr(Lo,"cry");
  const playerWon=isDuo()||W==="L";
  playerWon?sfx.win():sfx.lose();sfx.laugh();sfx.cry();
  shake();vib([70,40,70]);crowdHype();
  burst(W,CH[wk].lol,"lol",4);burst(Lo,CH[lk].boo,"boo",3);
  if(playerWon){const rc=$(W==="L"?"#fL":"#fR").getBoundingClientRect(),ar=app.getBoundingClientRect();confetti(70,rc.left-ar.left+rc.width/2,rc.top-ar.top+rc.height*.3)}
  await sleep(1100);if(!alive())return;
  if(pts===2){await announce(W,"+2 yulduz! Soni muhim!");if(!alive())return}
  if(armed(W,"zarina")){
    if(starsOf(Lo)>0){addStars(Lo,-1);shake();await announce(W,`${CH[lk].name}ning 1 yulduzi o'g'irlandi!`)}
    else await announce(W,"O'g'irlashga yulduz yo'q edi 😅");
    if(!alive())return;
  }
  if(armed(W,"muhiddin")){await announce(W,"Yutding — qalqon kerak bo'lmadi 😅");if(!alive())return}
  for(const k of ["sardor","zarina"])if(armed(Lo,k)){await announce(Lo,"Raund boy berildi — kuch behuda ketdi 😅");if(!alive())return}
  await say(W,wk,line(wk,"win",lk),1300);if(!alive())return;
  await say(Lo,lk,line(lk,"lose",wk),1000);if(!alive())return;
  return endRound(tok);
}
async function endRound(tok){
  if(tok!==M.tok)return;
  if(M.sp>=2||M.so>=2){await sleep(250);return finale()}
  hideBubbles();resetHands();
  M.round++;setRound(`RAUND ${M.round}`);
  setExpr("L","idle");setExpr("R","idle");
  big(`RAUND ${M.round}`,"small",800);sfx.boom();
  await sleep(900);if(tok!==M.tok)return;
  roundStart();
}
function oppPick(k){const b=CH[k].bias;if(b&&Math.random()<b[1])return b[0];return rnd(["tosh","qaychi","qogoz"])}
$("#gMute").addEventListener("click",()=>{MUTED=!MUTED;DB.settings.sound=!MUTED;save();updMute();ensureAudio();sfx.tap()});
async function exitMatch(){
  tapFx();
  const tour=M.mode==="tour";
  const cov=$("#cover"),wasCover=cov.classList.contains("show");
  if(wasCover)cov.classList.remove("show");
  const ok=await ask("🚪","Jangni tark etasizmi?",tour?"Bu jang hisobga olinmaydi — turnir jadvalidan qayta o'ynashingiz mumkin.":"Bu jang natijasi saqlanmaydi.","Ha, chiqish","Davom etish");
  if(!ok){if(wasCover)cov.classList.add("show");return}
  M.tok++;M.busy=true;skipFn=null;hideBubbles();cov.classList.remove("show");$("#pwban").classList.remove("on");hideMirror();
  if(tour){go("bracket");renderBracket()}else go("home");
}
$("#gExit").addEventListener("click",exitMatch);
$("#cvX").addEventListener("click",exitMatch);

function finale(){
  const pw=M.sp>M.so,wk=pw?M.p:M.o,lk=pw?M.o:M.p,duo=isDuo(),tour=M.mode==="tour";
  if(duo){DB.stats.duo=(DB.stats.duo||0)+1;save()}else recordMatch(M.p,pw);
  let title;
  if(duo)title=`${CH[wk].name.toUpperCase()} YUTDI! 🏆`;
  else if(tour)title=pw?(T.stage===0?"YARIM FINALDASAN! 🎉":T.stage===1?"FINALDASAN! 🔥":"G'ALABA! 🏆"):"TURNIRDAN CHIQDING 😭";
  else title=pw?"SEN YUTDING! 🏆":"YUTQAZDING! 😭";
  const t=$("#finT");t.textContent=title;t.className="fin-t"+(pw||duo?"":" sad");
  $("#finS").innerHTML=`${avHTML(M.p,pw?"laugh":"cry")}<span>${M.sp} : ${M.so}</span>${avHTML(M.o,pw?"cry":"laugh")}`;
  $("#finW").innerHTML=charSVG(wk,"laugh")+`<div class="crown">👑</div>`;
  $("#finL").innerHTML=charSVG(lk,"cry");
  const q1=$("#finQ1");q1.innerHTML=`<b style="color:${CH[wk].accent}">${CH[wk].name}${duo?(pw?" · 1-o'yinchi":" · 2-o'yinchi"):""}</b>`;q1.append(document.createTextNode(line(wk,"fwin",lk)));
  const q2=$("#finQ2");q2.innerHTML=`<b style="color:${CH[lk].accent}">${CH[lk].name}</b>`;q2.append(document.createTextNode(line(lk,"flose",wk)));
  const B=$("#finB");
  if(tour){
    B.innerHTML=`<button class="btn primary" id="fNext">DAVOM ETISH ▶</button>`;
    $("#fNext").onclick=()=>{tapFx();$("#final").classList.remove("show");tourAfterMatch(pw,M.sp,M.so)};
  }else{
    B.innerHTML=`<button class="btn primary" id="fAgain">QASOS OLISH 🔥</button><div class="row"><button class="btn glass" id="fNew">${duo?"QAHRAMONLARNI ALMASHTIRISH":"BOSHQA RAQIB"}</button><button class="btn glass" id="fHome">BOSH MENYU</button></div>`;
    $("#fAgain").onclick=()=>{tapFx();startMatch(M.p,M.o,M.mode)};
    $("#fNew").onclick=()=>{tapFx();$("#final").classList.remove("show");
      if(duo)openSelect("duo");
      else{SEL.mode="quick";SEL.step=2;SEL.p=M.p;SEL.cur=rnd(KEYS.filter(k=>k!==M.p&&k!==M.o));renderSelect(true);go("select")}};
    $("#fHome").onclick=()=>{tapFx();$("#final").classList.remove("show");go("home")};
  }
  $("#final").classList.add("show");
  (pw||duo)?sfx.fanfare():sfx.lose();sfx.laugh();setTimeout(()=>sfx.laugh(),1100);
  vib(pw||duo?[100,50,100,50,200]:[300]);
  confetti(pw||duo?160:60);
}

/* ================= CONFETTI ================= */
const cv=$("#fx"),cx=cv.getContext("2d");let parts=[],raf=null,W=0,H=0;
function sizeCv(){const r=app.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener("resize",sizeCv);sizeCv();
const CC=["#ffd23f","#ff2e7e","#22e4ff","#34f5a4","#ffffff","#8b5cf6","#ff8a00"];
function confetti(n,x,y){
  for(let i=0;i<n;i++){
    const bm=x!=null;
    parts.push({x:bm?x:Math.random()*W,y:bm?y:-20-Math.random()*H*.4,vx:bm?(Math.random()-.5)*12:(Math.random()-.5)*2,vy:bm?-Math.random()*10-3:Math.random()*2+1.5,
      w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:rnd(CC),life:0});
  }
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,W,H);
  parts.forEach(p=>{p.vy+=.2;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2))+1);cx.restore()});
  parts=parts.filter(p=>p.y<H+30&&p.life<420);
  raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,W,H),null);
}

/* ================= BOOT ================= */
icons();updMute();
let booted=false;
function boot(){if(booted)return;booted=true;go("home")}
$("#splash").addEventListener("click",()=>{ensureAudio();boot()});
setTimeout(boot,1900);
