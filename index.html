<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#170a36">
<title>DON DON ZIKI — Arena</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#170a36;--bg2:#2a0f5c;--ink:#1b1330;--text:#ffffff;--muted:#c3b8ea;
  --gold:#ffd23f;--orange:#ffae00;--pink:#ff2e7e;--cyan:#1fe0ff;--line:rgba(255,255,255,.16);
  --fd:'Bungee','Impact','Arial Black',system-ui,sans-serif;
  --fb:'Nunito','Trebuchet MS',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#170a36;--text:#ffffff}}
:root[data-theme="dark"]{--bg:#170a36;--text:#ffffff}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* ---------- MENU ---------- */
#menu{padding:14px 14px 16px;
  background:
   radial-gradient(120% 60% at 50% -10%,#6a24c9 0,transparent 60%),
   radial-gradient(80% 50% at 0% 105%,#8a0f55 0,transparent 60%),
   radial-gradient(80% 50% at 100% 105%,#0f4f8a 0,transparent 60%),var(--bg)}
.logo{text-align:center;position:relative;margin-top:4px}
.logo .l1{font-family:var(--fd);font-size:clamp(26px,8.5vw,42px);letter-spacing:2px;line-height:1;
  text-shadow:0 4px 0 #7a1fd1,0 0 22px rgba(170,90,255,.8)}
.logo .l2{font-family:var(--fd);font-size:clamp(58px,19vw,92px);line-height:.95;display:inline-block;
  background:linear-gradient(180deg,#fff7a8 0,#ffd23f 35%,#ff8a00 70%,#ff4d00 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 #a3141f) drop-shadow(0 0 20px rgba(255,160,0,.55));
  animation:pulse 1.8s ease-in-out infinite}
.logo .sub{color:var(--muted);font-weight:900;font-size:14px;margin-top:4px}
.step{margin:12px 0 8px;text-align:center;font-weight:900;font-size:16px;min-height:22px}
.step b{color:var(--gold)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px}
.card:nth-child(7){grid-column:2}.card:nth-child(7) .cs svg{animation-delay:-2.4s}
@media (max-height:720px){.card .tg{display:none}}
.card{position:relative;border-radius:22px;border:2px solid var(--line);overflow:hidden;
  background:linear-gradient(165deg,rgba(255,255,255,.13),rgba(255,255,255,.02));
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 6px 9px;
  transition:transform .15s,border-color .2s,box-shadow .2s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,var(--c) 0,transparent 62%);opacity:.4}
.card:active{transform:scale(.96)}
.card .cs{position:relative;flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-end}
.card .cs svg{height:100%;width:auto;aspect-ratio:200/260;max-width:100%;animation:bob 2.4s ease-in-out infinite}
.card:nth-child(2) .cs svg{animation-delay:-.4s}.card:nth-child(3) .cs svg{animation-delay:-.8s}.card:nth-child(4) .cs svg{animation-delay:-1.2s}.card:nth-child(5) .cs svg{animation-delay:-1.6s}.card:nth-child(6) .cs svg{animation-delay:-2s}
.card .nm{position:relative;font-family:var(--fd);font-size:12.5px;line-height:1.15;text-align:center}
.card .tg{position:relative;font-size:10.5px;color:var(--muted);font-weight:800;text-align:center;line-height:1.2}
.card .badge{position:absolute;top:8px;left:8px;z-index:2;font-family:var(--fd);font-size:11px;padding:4px 9px;border-radius:999px;display:none}
.card.sel-p{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(31,224,255,.3),0 0 28px rgba(31,224,255,.45)}
.card.sel-o{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,46,126,.3),0 0 28px rgba(255,46,126,.45)}
.card.sel-p .badge{display:block;background:var(--cyan);color:#00161a}
.card.sel-o .badge{display:block;background:var(--pink);color:#fff}
.mrow{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;border:0;border-radius:18px;padding:14px 10px;font-family:var(--fd);font-size:19px;color:#3a1400;
  background:linear-gradient(180deg,#fff08a,#ffae00);box-shadow:0 6px 0 #b35a00,0 12px 26px rgba(255,170,0,.35);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b35a00}
.btn:disabled{filter:grayscale(1);opacity:.45;box-shadow:0 6px 0 #555}
.btn.ghost{flex:0 0 auto;padding:14px 16px;font-size:14px;color:#fff;background:linear-gradient(180deg,#5b2bb0,#3a1780);box-shadow:0 6px 0 #1e0a47}
.btn.ghost:active{box-shadow:0 2px 0 #1e0a47}

/* ---------- VS ---------- */
#vs{background:#05020c;overflow:hidden}
.vsh{position:absolute;top:0;bottom:0;width:64%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.vsh.l{left:0;clip-path:polygon(0 0,100% 0,58% 100%,0 100%);background:linear-gradient(150deg,var(--c),#12052b 85%);animation:slideL .45s cubic-bezier(.2,1,.3,1) both;justify-content:flex-start;padding-top:10%}
.vsh.r{right:0;clip-path:polygon(42% 0,100% 0,100% 100%,0 100%);background:linear-gradient(330deg,var(--c),#12052b 85%);animation:slideR .45s cubic-bezier(.2,1,.3,1) both;justify-content:flex-end;padding-bottom:10%}
.vsh .cs{width:74%;max-width:260px}
.vsh .cs svg{width:100%;height:auto;display:block}
.vsh.r .cs{transform:scaleX(-1)}
.vsh .vn{font-family:var(--fd);font-size:clamp(20px,7vw,30px);text-shadow:0 3px 0 rgba(0,0,0,.5)}
.vsh .vt{font-weight:900;font-size:13px;opacity:.85}
.vsh.l .vn,.vsh.l .vt{margin-right:22%}.vsh.r .vn,.vsh.r .vt{margin-left:22%}
.vstext{position:absolute;top:50%;left:50%;font-family:var(--fd);font-size:clamp(84px,28vw,130px);color:#fff;
  text-shadow:0 0 30px #fff,0 7px 0 var(--pink),0 0 60px var(--pink);animation:vsSlam .55s .38s both}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash .6s .45s both;pointer-events:none}

/* ---------- GAME ---------- */
#game{background:var(--bg)}
.hud{position:relative;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 12px 8px;
  background:linear-gradient(180deg,rgba(0,0,0,.45),transparent)}
.pl{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pl.r{align-items:flex-end}
.pl .n{font-family:var(--fd);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stars{display:flex;gap:5px}
.stars i{width:22px;height:22px;background:rgba(255,255,255,.18);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.stars i.on{background:linear-gradient(#fff7a8,#ffae00);animation:starpop .55s cubic-bezier(.2,1.8,.4,1)}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.rnd{font-family:var(--fd);font-size:13px;padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--line);white-space:nowrap}
.icons{display:flex;gap:6px}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.1);font-size:15px;display:grid;place-items:center;padding:0}

.stage{position:relative;flex:1;min-height:0;overflow:hidden}
.sky{position:absolute;inset:0;background:
  radial-gradient(70% 45% at 50% 100%,rgba(255,46,126,.35) 0,transparent 70%),
  radial-gradient(60% 40% at 50% 0%,rgba(120,60,255,.45) 0,transparent 70%),
  linear-gradient(180deg,#1c0b44 0,#2f1068 50%,#150733 100%)}
.neon{position:absolute;top:2%;left:0;right:0;text-align:center;font-family:var(--fd);font-size:13px;letter-spacing:3px;color:#ff8ac0;
  text-shadow:0 0 6px var(--pink),0 0 18px var(--pink);opacity:.55}
.beam{position:absolute;top:-8%;width:42%;height:95%;pointer-events:none;mix-blend-mode:screen;transform-origin:50% 0;
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 90%);
  clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);animation:sweep 5s ease-in-out infinite alternate}
.beam.b1{left:-6%}
.beam.b2{right:-6%;animation-delay:-2.5s;animation-direction:alternate-reverse}
.beam.b3{left:29%;background:linear-gradient(180deg,rgba(255,46,126,.35),transparent 85%);animation-duration:3.6s}
.crowd{position:absolute;left:0;right:0;bottom:18%;height:22%;pointer-events:none}
.crowd svg{width:100%;height:100%;display:block}
.cp{animation:bob 1.5s ease-in-out infinite;transform-box:fill-box}
.crowd.hype .cp{animation:hop .32s ease-in-out infinite}
.flashp{animation:tw 3s infinite}
.floor{position:absolute;left:-40%;right:-40%;bottom:0;height:40%;transform-origin:50% 100%;
  transform:perspective(240px) rotateX(58deg);
  background:
   repeating-linear-gradient(90deg,rgba(31,224,255,.3) 0 2px,transparent 2px 64px),
   repeating-linear-gradient(0deg,rgba(31,224,255,.3) 0 2px,transparent 2px 44px),
   linear-gradient(180deg,#3a137a,#0d0524)}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--cyan);box-shadow:0 0 20px 4px var(--cyan)}
.ring{position:absolute;left:50%;bottom:4%;width:94%;height:13%;transform:translateX(-50%);border-radius:50%;
  border:3px solid var(--pink);box-shadow:0 0 22px var(--pink),inset 0 0 22px var(--pink);opacity:.85}

.fighter{position:absolute;bottom:4%;width:47%;display:flex;flex-direction:column;align-items:center;z-index:4}
.fighter.left{left:1.5%}.fighter.right{right:1.5%}
.fighter.left.enter{animation:inL .7s cubic-bezier(.2,1.35,.4,1) both}
.fighter.right.enter{animation:inR .7s .12s cubic-bezier(.2,1.35,.4,1) both}
.char{position:relative;width:100%;max-width:235px;aspect-ratio:200/260}
.char svg{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 96%}
.fighter.right .char{transform:scaleX(-1)}
.char.idle svg{animation:bob 2.2s ease-in-out infinite}
.char.laugh svg{animation:laughS .24s ease-in-out infinite}
.char.cry svg{animation:sob .55s ease-in-out infinite}
.char.tense svg{animation:jit .12s linear infinite}
.nameplate{font-family:var(--fd);font-size:12px;padding:4px 10px;border-radius:10px;background:rgba(0,0,0,.55);border:1px solid var(--line);margin-top:-4px;white-space:nowrap}

.stream{animation:flow .45s linear infinite}
.drop{transform-box:fill-box;animation:drop .9s ease-in infinite}
.sweat{transform-box:fill-box;animation:sweat 1s ease-in infinite}

.bubble{position:absolute;top:6%;max-width:74%;z-index:8;background:#fff;color:var(--ink);border-radius:18px;
  padding:9px 14px 11px;font-weight:800;font-size:15.5px;line-height:1.32;box-shadow:0 7px 0 rgba(0,0,0,.28);
  opacity:0;transform:scale(.6) translateY(12px);transition:opacity .2s,transform .25s cubic-bezier(.2,1.5,.4,1);pointer-events:none}
.bubble .who{display:block;font-family:var(--fd);font-size:11.5px;font-weight:400;margin-bottom:2px}
.bubble.l{left:3%;transform-origin:18% 100%}.bubble.r{right:3%;transform-origin:82% 100%}
.bubble.show{opacity:1;transform:none}
.bubble::after{content:"";position:absolute;bottom:-13px;border:13px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.l::after{left:30px}.bubble.r::after{right:30px}

.big{position:absolute;left:0;right:0;top:9%;z-index:7;text-align:center;pointer-events:none;
  font-family:var(--fd);font-size:clamp(46px,15vw,78px);line-height:1;color:#fff;opacity:0;
  text-shadow:0 5px 0 #7a1fd1,0 0 30px #b36bff}
.big.pop{animation:bigpop .5s cubic-bezier(.2,1.6,.4,1) forwards}
.big.win{color:var(--gold);text-shadow:0 5px 0 #b35a00,0 0 34px rgba(255,200,0,.9)}
.big.lose{color:#ff5a7a;text-shadow:0 5px 0 #6b0020,0 0 34px rgba(255,40,90,.9)}
.big.draw{color:var(--cyan);text-shadow:0 5px 0 #005d6b,0 0 30px rgba(31,224,255,.9)}
.big.small{font-size:clamp(34px,11vw,54px)}
.big.out{opacity:0 !important;transition:opacity .3s}

.hand{position:absolute;top:34%;z-index:6;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:44px;
  background:radial-gradient(circle at 40% 35%,#fff 0,#ffe9a8 55%,#ffb000 100%);
  box-shadow:0 0 0 4px #fff,0 8px 0 4px rgba(0,0,0,.3),0 0 30px rgba(255,210,63,.8);
  opacity:0;transform:scale(.3);transition:opacity .2s,transform .25s cubic-bezier(.2,1.5,.4,1)}
.hand span{display:inline-block;line-height:1}
.hand.l{left:calc(50% - 96px)}.hand.r{right:calc(50% - 96px)}
.hand.r span{transform:scaleX(-1)}
.hand.show{opacity:1;transform:scale(1)}
.hand.pump{animation:pump .42s ease}
.hand.reveal{animation:reveal .5s cubic-bezier(.2,1.6,.4,1)}
.hand.win{box-shadow:0 0 0 5px var(--gold),0 8px 0 4px rgba(0,0,0,.3),0 0 40px 8px rgba(255,210,63,.9)}
.hand.lose{filter:grayscale(.7) brightness(.75);transform:scale(.85)}
.vsmid{position:absolute;top:36%;left:50%;transform:translateX(-50%);z-index:5;font-family:var(--fd);font-size:24px;color:#fff;opacity:0;transition:opacity .2s;text-shadow:0 0 14px var(--pink)}
.vsmid.show{opacity:.9}

.fxl{position:absolute;inset:0;pointer-events:none;z-index:9}
.ftx{position:absolute;font-family:var(--fd);font-size:22px;white-space:nowrap;animation:floatUp 1.5s ease-out forwards}
.ftx.lol{color:var(--gold);text-shadow:0 3px 0 #b35a00,0 0 14px rgba(255,200,0,.7)}
.ftx.boo{color:#8fe3ff;text-shadow:0 3px 0 #0b4a77,0 0 14px rgba(80,200,255,.7)}
.emo{position:absolute;font-size:26px;animation:rise 1.8s ease-out forwards}

.skip{position:absolute;bottom:1.5%;left:0;right:0;text-align:center;font-size:11.5px;font-weight:800;color:rgba(255,255,255,.55);opacity:0;transition:opacity .2s;z-index:9;pointer-events:none}
.skip.on{opacity:1}

.controls{position:relative;z-index:10;padding:8px 12px 14px;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55))}
.hint{text-align:center;font-weight:900;color:var(--gold);font-size:15px;height:22px;margin-bottom:6px;opacity:0;transition:opacity .2s}
.hint.on{opacity:1;animation:blink 1.1s ease-in-out infinite}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{border:0;border-radius:20px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:linear-gradient(180deg,#4a2596,#27105a);box-shadow:0 6px 0 #140733,inset 0 2px 0 rgba(255,255,255,.22);transition:transform .08s,box-shadow .08s,opacity .2s}
.pick .e{font-size:40px;line-height:1.05;filter:drop-shadow(0 4px 5px rgba(0,0,0,.45))}
.pick .t{font-family:var(--fd);font-size:13px}
.pick:active{transform:translateY(4px);box-shadow:0 2px 0 #140733}
.pick:disabled{opacity:.4}
.pick.chosen{opacity:1;background:linear-gradient(180deg,#fff08a,#ffae00);color:#3a1400;box-shadow:0 6px 0 #b35a00}

/* ---------- FINAL ---------- */
#final{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:18px;text-align:center;background:radial-gradient(90% 60% at 50% 40%,rgba(90,30,180,.75),rgba(8,3,20,.93));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#final.show{display:flex;animation:fadeIn .35s ease}
.fin-t{font-family:var(--fd);font-size:clamp(32px,10.5vw,52px);line-height:1;
  background:linear-gradient(180deg,#fff7a8,#ffae00 60%,#ff5e00);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #8a1a10)}
.fin-t.sad{background:linear-gradient(180deg,#d9f6ff,#6fcfff 60%,#2a7fd6);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 #0d2f66)}
.fin-sc{font-family:var(--fd);font-size:30px}
.fin-ch{display:flex;align-items:flex-end;justify-content:center;width:100%;max-width:420px}
.fin-w{position:relative;width:54%}.fin-l{width:36%;opacity:.92}
.fin-w svg,.fin-l svg{width:100%;height:auto;display:block;overflow:visible;transform-origin:50% 96%}
.fin-w svg{animation:laughS .24s ease-in-out infinite}
.fin-l svg{animation:sob .55s ease-in-out infinite}
.crown{position:absolute;top:-4%;left:50%;font-size:46px;animation:crown 1.2s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.fin-q{background:#fff;color:var(--ink);border-radius:16px;padding:10px 14px 12px;font-weight:800;font-size:15px;line-height:1.35;max-width:360px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.fin-q b{display:block;font-family:var(--fd);font-weight:400;font-size:11.5px}
.fin-q.alt{background:#dff4ff}
.fin-b{display:flex;gap:10px;width:100%;max-width:360px;margin-top:6px}

#fx{position:absolute;inset:0;pointer-events:none;z-index:30}
#app.shake{animation:shake .42s}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hop{50%{transform:translateY(-7px)}}
@keyframes laughS{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-10px) rotate(2.5deg)}}
@keyframes sob{0%,100%{transform:translateX(0) scaleY(1)}25%{transform:translateX(-3px) scaleY(.975)}75%{transform:translateX(3px) scaleY(.975)}}
@keyframes jit{0%{transform:translate(0,0)}25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}100%{transform:translate(0,0)}}
@keyframes flow{to{stroke-dashoffset:-19}}
@keyframes drop{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),46px);opacity:0}}
@keyframes sweat{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes pump{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-24px) scale(1.08)}100%{transform:translateY(0) scale(1)}}
@keyframes reveal{0%{transform:scale(.5) rotate(-25deg)}60%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes bigpop{0%{opacity:0;transform:scale(2.4)}60%{opacity:1;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.4) rotate(var(--r))}15%{opacity:1;transform:translate(-50%,-12px) scale(1.15) rotate(var(--r))}100%{opacity:0;transform:translate(calc(-50% + var(--x)),-95px) scale(1) rotate(var(--r))}}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-150px) scale(1.2) rotate(var(--r))}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
@keyframes sweep{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes tw{0%,92%,100%{opacity:0}95%{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes blink{50%{opacity:.45}}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1) rotate(0)}}
@keyframes inL{from{transform:translateX(-130%)}to{transform:none}}
@keyframes inR{from{transform:translateX(130%)}to{transform:none}}
@keyframes slideL{from{transform:translateX(-100%)}}

@keyframes crown{0%,100%{transform:translateX(-50%) rotate(-10deg) translateY(0)}50%{transform:translateX(-50%) rotate(8deg) translateY(-7px)}}
@keyframes fadeIn{from{opacity:0}}
@media (prefers-reduced-motion: reduce){

}

      <div class="hint" id="hint">Tanla! 👇</div>

let AC=null, master=null, MUTED=false;
function ensureAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);}catch(e){AC=null}}
  if(AC&&AC.state==="suspended")AC.resume();
}
function tone(f,dur,type="sine",vol=.2,when=0,slide){
  if(!AC||MUTED)return;
  const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(master);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol,when=0,freq=1500){
  if(!AC||MUTED)return;
  const t=AC.currentTime+when,len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  src.buffer=buf;f.type="bandpass";f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f).connect(g).connect(master);src.start(t);src.stop(t+dur);
}

  click(){tone(900,.05,"square",.06)},
  blip(){tone(320+Math.random()*260,.03,"square",.025)},
  don(){tone(170,.38,"sine",.7,0,45);noise(.09,.35,0,1100)},
  ziki(){tone(240,.45,"sine",.7,0,55);noise(.22,.45,0,3200);tone(990,.14,"square",.07)},
  pop(){tone(520,.14,"triangle",.25,0,1300)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,"square",.1,i*.09));tone(1047,.55,"triangle",.14,.36)},
  lose(){[392,370,349].forEach((f,i)=>tone(f,.3,"sawtooth",.09,i*.32));tone(294,.9,"sawtooth",.1,.96,240)},
  laugh(){for(let i=0;i<8;i++){const f=(i%2?560:660)*(1-i*.035);tone(f,.1,"triangle",.17,.05+i*.12,f*.75)}},
  cry(){tone(720,.5,"sine",.1,.15,470);tone(680,.7,"sine",.1,.7,380)},
  draw(){tone(440,.14,"triangle",.14);tone(440,.2,"triangle",.14,.18)},
  whoosh(){noise(.4,.3,0,700)},

const lastLine={};
/* Murojaat: Jasur hammaga "sen"; Soliha Zarinaga "sen", qolganlarga "siz"; qolganlar Soliha va Jasur akaga "siz" */
function isFormal(k,tk){
  if(k==="sardor")return true;
  if(k==="jasur")return false;
  if(k==="soliha")return tk!=="zarina";
  return tk==="jasur"||tk==="soliha";
}
function fmt(str,k,tk){
  const f=isFormal(k,tk);
  const target=k==="sardor"?NICK[tk]:(tk==="jasur")?"Jasur aka":CH[tk].name;
  return str.replace(/\[([^\]|]*)\|([^\]]*)\]/g,(m,a,b)=>f?b:a).replace(/\{t\}/g,target);
}
function line(k,type,tk){
  const du=DUEL[k]&&DUEL[k][tk]&&DUEL[k][tk][type];
  if(du&&Math.random()<.55)return fmt(rnd(du),k,tk);
  const arr=LINES[k][type];let s,tries=0;
  do{s=rnd(arr);tries++}while(arr.length>1&&lastLine[k+type]===s&&tries<6);
  lastLine[k+type]=s;return fmt(s,k,tk);
}

  const sr=stage.getBoundingClientRect();
  for(let i=0;i<9;i++)setTimeout(()=>{
    const e=document.createElement("div");e.className="emo";e.textContent=rnd(["😂","🤣","😆","👏","🔥"]);
    e.style.left=(Math.random()*sr.width*.9)+"px";e.style.top=(sr.height*(.6+Math.random()*.12))+"px";
    e.style.setProperty("--r",(Math.random()*40-20)+"deg");fxl.appendChild(e);setTimeout(()=>e.remove(),1900);
  },i*110);
}
function crowdSVG(){
  let s='<svg viewBox="0 0 400 90" preserveAspectRatio="xMidYMax slice">';
  for(let row=0;row<2;row++){
    const y=row?74:54,sc=row?1.15:.9,col=row?"#0b0520":"#1d0d42";
    for(let x=-10;x<420;x+=row?26:21){
      const hx=x+(Math.random()*6-3),hy=y+(Math.random()*6-3),d=(Math.random()*1.4).toFixed(2);
      s+=`<g class="cp" style="animation-delay:-${d}s"><circle cx="${hx}" cy="${hy-16*sc}" r="${8*sc}" fill="${col}"/><path d="M${hx-13*sc} ${hy+30} Q${hx-13*sc} ${hy-6*sc} ${hx} ${hy-6*sc} Q${hx+13*sc} ${hy-6*sc} ${hx+13*sc} ${hy+30} Z" fill="${col}"/></g>`;
      if(!row&&Math.random()<.18)s+=`<circle class="flashp" cx="${hx+7}" cy="${hy-22}" r="2.2" fill="#fff" style="animation-delay:-${(Math.random()*3).toFixed(2)}s"/>`;
    }
  }
  return s+"</svg>";
}
function setPicks(on){document.querySelectorAll(".pick").forEach(b=>{b.disabled=!on;if(on)b.classList.remove("chosen")});$("#hint").classList.toggle("on",on)}
function resetHands(){[hL,hR].forEach(h=>{h.className="hand "+(h===hL?"l":"r");h.firstElementChild.textContent="✊"});$("#vsmid").classList.remove("show")}

async function startGame(){
  S.tok++;const tok=S.tok;
  S.sp=0;S.so=0;S.busy=true;
  $("#hudP").textContent=CH[S.p].name;$("#hudO").textContent=CH[S.o].name;
  $("#hudP").style.color=CH[S.p].accent;$("#hudO").style.color=CH[S.o].accent;
  $("#nL").textContent=CH[S.p].name+" (sen)";$("#nR").textContent=CH[S.o].name;
  updStars();setRound("RAUND 1");hideBubbles();resetHands();setPicks(false);bigEl.className="big";fxl.innerHTML="";
  $("#crowd").innerHTML=crowdSVG();
  setExpr("L","idle");setExpr("R","idle");
  show("game");
  ["#fL","#fR"].forEach(id=>{const f=$(id);f.classList.remove("enter");void f.offsetWidth;f.classList.add("enter")});
  await sleep(750);if(tok!==S.tok)return;
  big("RAUND 1","small",900);sfx.boom();vib(40);
  await sleep(1000);if(tok!==S.tok)return;
  await say("R",S.o,line(S.o,"intro",S.p));if(tok!==S.tok)return;
  await say("L",S.p,line(S.p,"intro",S.o));if(tok!==S.tok)return;
  hideBubbles();
  S.busy=false;setPicks(true);
}

function oppPick(k){
  const b=CH[k].bias;
  if(b&&Math.random()<b[1])return b[0];
  return rnd(["tosh","qaychi","qogoz"]);
}

async function play(ch,btn){
  if(S.busy)return;S.busy=true;const tok=S.tok;
  ensureAudio();sfx.click();vib(20);
  document.querySelectorAll(".pick").forEach(b=>b.disabled=true);btn.classList.add("chosen");$("#hint").classList.remove("on");
  hideBubbles();resetHands();hideBig();
  setExpr("L","tense");setExpr("R","tense");
  hL.classList.add("show");hR.classList.add("show");$("#vsmid").classList.add("show");
  await sleep(250);
  for(const [i,w] of ["DON!","DON!","ZIKI!"].entries()){
    if(tok!==S.tok)return;
    big(w,i===2?"win":"");
    [hL,hR].forEach(h=>{h.classList.remove("pump");void h.offsetWidth;h.classList.add("pump")});
    i<2?sfx.don():sfx.ziki();vib(i<2?30:60);
    await sleep(560);
  }
  if(tok!==S.tok)return;
  const oc=oppPick(S.o);
  hL.firstElementChild.textContent=EMO[ch];hR.firstElementChild.textContent=EMO[oc];
  [hL,hR].forEach(h=>{h.classList.remove("pump");void h.offsetWidth;h.classList.add("reveal")});
  sfx.pop();hideBig();
  const r=ch===oc?0:(BEATS[ch]===oc?1:-1);
  await sleep(480);if(tok!==S.tok)return;

  if(r===0){
    big("DURANG!","draw",1200);sfx.draw();vib(25);
    setExpr("L","idle");setExpr("R","idle");
    await sleep(900);if(tok!==S.tok)return;
    const side=Math.random()<.5?"L":"R",k=side==="L"?S.p:S.o,t=side==="L"?S.o:S.p;
    await say(side,k,line(k,"draw",t),1100);if(tok!==S.tok)return;
    hideBubbles();resetHands();setRound(`RAUND ${S.sp+S.so+1} · QAYTA`);
  }else{
    const W=r>0?"L":"R",Lo=r>0?"R":"L",wk=r>0?S.p:S.o,lk=r>0?S.o:S.p;
    r>0?S.sp++:S.so++;updStars();
    (r>0?hL:hR).classList.add("win");(r>0?hR:hL).classList.add("lose");
    big(r>0?"YUTDING!":"YUTQAZDING!",(r>0?"win":"lose")+(r>0?"":" small"),1500);
    setExpr(W,"laugh");setExpr(Lo,"cry");
    r>0?sfx.win():sfx.lose();sfx.laugh();sfx.cry();
    shake();vib([70,40,70]);crowdHype();
    burst(W,CH[wk].lol,"lol",4);burst(Lo,CH[lk].boo,"boo",3);
    if(r>0){const rc=$("#fL").getBoundingClientRect(),ar=app.getBoundingClientRect();confetti(70,rc.left-ar.left+rc.width/2,rc.top-ar.top+rc.height*.3)}
    await sleep(1100);if(tok!==S.tok)return;
    await say(W,wk,line(wk,"win",lk),1300);if(tok!==S.tok)return;
    await say(Lo,lk,line(lk,"lose",wk),1000);if(tok!==S.tok)return;
    if(S.sp===2||S.so===2){await sleep(250);return finale()}
    hideBubbles();resetHands();setRound(`RAUND ${S.sp+S.so+1}`);
  }
  setExpr("L","idle");setExpr("R","idle");
  big(`RAUND ${S.sp+S.so+1}`,"small",800);sfx.boom();
  await sleep(900);if(tok!==S.tok)return;
  S.busy=false;setPicks(true);
}
document.querySelectorAll(".pick").forEach(b=>b.addEventListener("click",()=>play(b.dataset.c,b)));

/* ================= FINAL ================= */
function finale(){
  const pw=S.sp>S.so,wk=pw?S.p:S.o,lk=pw?S.o:S.p;
  const t=$("#finT");t.textContent=pw?"SEN YUTDING! 🏆":"YUTQAZDING! 😭";t.className="fin-t"+(pw?"":" sad");
  $("#finS").textContent=`${S.sp} : ${S.so}`;
  $("#finW").innerHTML=charSVG(wk,"laugh")+`<div class="crown">👑</div>`;
  $("#finL").innerHTML=charSVG(lk,"cry");
  $("#finQ1").innerHTML=`<b style="color:${CH[wk].accent}">${CH[wk].name}</b>`;
  $("#finQ1").append(document.createTextNode(line(wk,"fwin",lk)));
  $("#finQ2").innerHTML=`<b style="color:${CH[lk].accent}">${CH[lk].name}</b>`;
  $("#finQ2").append(document.createTextNode(line(lk,"flose",wk)));
  $("#final").classList.add("show");
  pw?sfx.fanfare():sfx.lose();sfx.laugh();setTimeout(()=>sfx.laugh(),1100);
  vib(pw?[100,50,100,50,200]:[300]);
  confetti(pw?180:70);
}
$("#againBtn").addEventListener("click",()=>{ensureAudio();sfx.click();$("#final").classList.remove("show");showVS()});
$("#menuBtn").addEventListener("click",toMenu);
$("#exitBtn").addEventListener("click",toMenu);
function toMenu(){sfx.click();S.tok++;S.busy=true;skipFn=null;$("#final").classList.remove("show");hideBubbles();show("menu")}
$("#muteBtn").addEventListener("click",()=>{MUTED=!MUTED;$("#muteBtn").textContent=MUTED?"🔇":"🔊";ensureAudio()});

/* ================= CONFETTI ================= */
const cv=$("#fx"),cx=cv.getContext("2d");let parts=[],raf=null,W=0,H=0;
function sizeCv(){const r=app.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener("resize",sizeCv);sizeCv();
const CC=["#ffd23f","#ff2e7e","#1fe0ff","#3cff9e","#ffffff","#b36bff","#ff8a00"];
function confetti(n,x,y){
  for(let i=0;i<n;i++){
    const burstMode=x!=null;
    parts.push({x:burstMode?x:Math.random()*W,y:burstMode?y:-20-Math.random()*H*.4,
      vx:burstMode?(Math.random()-.5)*12:(Math.random()-.5)*2,vy:burstMode?-Math.random()*10-3:Math.random()*2+1.5,
      w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:rnd(CC),life:0});
  }
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,W,H);
  parts.forEach(p=>{p.vy+=.2;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2))+1);cx.restore()});
  parts=parts.filter(p=>p.y<H+30&&p.life<400);
  raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,W,H),null);
}

renderMenu();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
